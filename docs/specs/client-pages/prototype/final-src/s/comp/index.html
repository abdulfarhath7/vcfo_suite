<title>Client Compliances Pages</title>


<style>
:root{--bg:oklch(97.4% 0.006 255);--panel:oklch(100% 0 0);--raised:oklch(96.6% 0.007 255);--border:oklch(92.2% 0.011 255);--hair:oklch(94.8% 0.007 255);--fg:oklch(21% 0.042 264);--muted:oklch(46% 0.028 258);--subtle:oklch(55% 0.022 255);

--due:oklch(66% 0.17 48);--due-light:oklch(96.8% 0.04 55);--due-text:oklch(48% 0.14 42);--due-chip:oklch(55% 0.17 42);
--over:oklch(57% 0.2 22);--over-light:oklch(96.4% 0.026 18);--over-text:oklch(46% 0.17 20);--over-chip:oklch(52% 0.2 22);
--prog:oklch(55% 0.16 252);--prog-light:oklch(96% 0.026 250);--prog-text:oklch(43% 0.13 254);
--up:oklch(82% 0.018 255);--up-light:oklch(96.6% 0.007 255);--up-text:oklch(46% 0.028 258);
--violet:oklch(54% 0.17 292);--violet-light:oklch(96.4% 0.032 292);

--spring:linear(0,0.0637,0.2021,0.3619,0.5141,0.6451,0.7506,0.8315,0.8909,0.9328,0.9613,0.9799,0.9914,0.9981,1.0016,1.0032,1.0036,1.0034,1.0029,1.0023,1.0018,1.0013,1.0009,1.0006,1.0004);
/* canvas chrome */--cv:oklch(93% 0.008 255)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cv:oklch(22% 0.02 260)}}
:root[data-theme="dark"]{--cv:oklch(22% 0.02 260);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--cv);font-family:Manrope,system-ui,sans-serif;color:var(--fg);font-size:13px;-webkit-font-smoothing:antialiased}
a{color:var(--primary);text-decoration:none;font-weight:700}
button{font-family:inherit}
/* ---------- canvas ---------- */
.canvas{padding:40px 40px 80px;display:flex;flex-direction:column;gap:56px;min-width:1520px}
.cv-head{display:flex;align-items:flex-end;gap:16px}
.cv-head h1{margin:0;font:700 26px "Space Grotesk",Manrope;color:var(--fg);letter-spacing:-.02em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cv-head h1,:root:not([data-theme="light"]) .ab-label{color:#e6ecf5}}
.cv-nav{display:flex;gap:6px;flex-wrap:wrap}
.cv-nav a{font:600 12px Manrope;padding:5px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--border);color:var(--navy-ink,var(--navy))}
.ab-label{font:700 15px Manrope;color:var(--navy-ink,var(--navy));margin:0 0 10px;display:flex;gap:10px;align-items:center}
.ab-label .tag{font:600 11px "IBM Plex Mono";padding:2px 7px;border-radius:4px;background:var(--panel);border:1px solid var(--border);color:var(--muted)}
.ab{width:1440px;background:var(--bg);border-radius:4px;box-shadow:0 30px 60px -30px oklch(20% 0.04 264 / .45);overflow:hidden;position:relative}
.row-abs{display:flex;gap:40px;align-items:flex-start;flex-wrap:wrap}

/* ---------- shell ---------- */
.shell{display:flex;min-height:900px;position:relative}
.side{width:248px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column}
.side .brand{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid oklch(100% 0 0 / .08);font-weight:700}
.side .logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,light-dark(#fff, oklch(13% 0 89.9)),light-dark(#c9d6ea, oklch(33.8% 0.031 258.9)));color:var(--navy);display:grid;place-items:center;font:800 11px Manrope}
.snav{display:flex;flex-direction:column;gap:2px;padding:12px 8px}
.snav a{display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:oklch(82% 0.02 255);position:relative}
.snav a svg{color:oklch(72% 0.03 255)}
.snav a.on{background:oklch(100% 0 0 / .1);box-shadow:inset 0 0 0 1px oklch(66% 0.16 262 / .45);color:#fff;font-weight:600}
.snav a.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:99px;background:oklch(66% 0.16 262)}
.snav a.on svg{color:oklch(80% 0.1 255)}
.snav a.sub{height:32px;padding-left:40px;font-size:13px}
.snav a.sub.on{background:oklch(100% 0 0 / .06);box-shadow:none}
.snav a.sub.on::before{background:var(--gold)}
.snav .n{margin-left:auto;font:600 11px "IBM Plex Mono";background:oklch(100% 0 0 / .12);border-radius:4px;padding:1px 6px;color:#fff}
.sblock{margin:auto 8px 0;padding:12px 6px 0;border-top:1px solid oklch(100% 0 0 / .08)}
.scap{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:oklch(72% 0.03 255);padding:0 6px 8px}
.person{display:flex;align-items:center;gap:10px;padding:6px}
.ph{width:32px;height:32px;border-radius:99px;flex:none;display:grid;place-items:center;font:700 11px Manrope;color:#fff;box-shadow:0 0 0 2px oklch(100% 0 0 / .15)}
.person b{display:block;font-size:12.5px;font-weight:600}
.person small{font-size:11px;color:oklch(72% 0.03 255)}
.icons{display:flex;gap:4px;padding:0 6px 8px 48px}
.icons span{width:24px;height:24px;border-radius:6px;background:oklch(100% 0 0 / .08);display:grid;place-items:center;color:oklch(85% 0.03 255)}
.acct{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid oklch(100% 0 0 / .08);margin-top:6px}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid light-dark(oklch(91.5% 0.012 255 / .6), oklch(25.4% 0.012 255 / 0.6));background:light-dark(oklch(100% 0 0 / .9), oklch(13% 0 0 / 0.9))}
.crumb{display:flex;align-items:center;gap:6px;flex:1;font-size:13px;color:var(--muted)}
.crumb b{color:var(--fg);font-weight:600}
.crumb .ci{width:24px;height:24px;border-radius:8px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center}
.search{display:flex;align-items:center;gap:8px;width:256px;height:36px;padding:0 10px 0 12px;border-radius:8px;border:1px solid light-dark(oklch(91.5% 0.012 255 / .7), oklch(25.4% 0.012 255 / 0.7));background:light-dark(oklch(96.8% 0.006 250 / .5), oklch(17.8% 0.006 250 / 0.5));color:var(--muted);font:500 13px Manrope}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:4px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--border);font:500 11px "IBM Plex Mono";color:var(--muted)}
.tb{width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;position:relative}
.tb .badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 3px;border-radius:99px;background:var(--primary-fill,var(--primary));color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;box-shadow:0 0 0 2px var(--panel)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.page{padding:22px 24px 120px;display:flex;flex-direction:column;gap:16px}
/* ---------- components ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);min-width:0;position:relative}
.card.t::before{content:"";position:absolute;left:18px;top:-1px;width:38px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.st{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--navy-ink,var(--navy));margin:0}
.h1{font:700 24px "Space Grotesk",Manrope;letter-spacing:-.025em;margin:0;color:var(--fg)}
.metric{font-family:"Space Grotesk",Manrope;font-weight:600;letter-spacing:-.035em;font-feature-settings:"tnum"}
.mono{font-family:"IBM Plex Mono",monospace;font-feature-settings:"tnum"}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;line-height:16px;white-space:nowrap}
.c-ok{background:var(--ok-light);color:var(--ok-text)}.c-due{background:var(--due-light);color:var(--due-text)}.c-over{background:var(--over-light);color:var(--over-text)}.c-up{background:var(--up-light);color:var(--up-text);box-shadow:inset 0 0 0 1px var(--border)}.c-prog{background:var(--prog-light);color:var(--prog-text)}
.area{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font:700 11px "IBM Plex Mono";letter-spacing:.02em;color:var(--navy-ink,var(--navy));background:light-dark(oklch(95% 0.012 255), oklch(20.5% 0.01 255));box-shadow:inset 0 0 0 1px oklch(88% 0.02 255)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:6px;font:600 13px Manrope;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}
.btn-n{background:var(--navy);color:#fff}.btn-n:hover{background:var(--navy-2)}
.btn-p{background:var(--primary-fill,var(--primary));color:#fff}
.btn-o{background:var(--panel);color:var(--fg);border-color:var(--border)}
.btn-s{height:30px;padding:0 10px;font-size:12px}
.ibtn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.ibtn:hover{color:var(--navy-ink,var(--navy));border-color:oklch(54.6% 0.215 263 / .35)}
/* sliding pill */
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:auto;padding:2px;border-radius:8px;background:light-dark(oklch(96.5% 0.008 250), oklch(18.3% 0.008 250));box-shadow:inset 0 0 0 1px var(--border)}
.seg>.thumb{position:absolute;top:2px;bottom:2px;left:0;border-radius:6px;background:var(--navy);box-shadow:0 1px 2px oklch(21% 0.042 264 / .25);transition:transform .42s var(--spring),width .42s var(--spring)}
.seg button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;border:0;background:none;height:30px;padding:0 12px;border-radius:6px;font:500 12.5px Manrope;color:light-dark(oklch(50% 0.022 255), oklch(80% 0.015 255));cursor:pointer;white-space:nowrap;transition:color .2s}
.seg button.on{color:#fff;font-weight:600}
.seg .cnt{font:600 11px "IBM Plex Mono";color:oklch(55% 0.022 255)}
.seg button.on .cnt{color:oklch(100% 0 0 / .72)}
.seg .dot{width:7px;height:7px;border-radius:99px}
/* info popover */
.info{position:relative;display:inline-flex;vertical-align:middle}
.info>button{width:20px;height:20px;border:0;border-radius:4px;background:none;color:oklch(62% 0.02 255);display:grid;place-items:center;cursor:pointer;padding:0}
.info>button:hover{color:var(--navy-ink,var(--navy))}
.info .pop{position:absolute;left:50%;top:calc(100% + 8px);z-index:40;width:min(280px,calc(100vw - 24px));padding:10px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--pop);font:500 12px/1.45 Manrope;color:var(--fg);opacity:0;visibility:hidden;transform:translate(-50%,-4px);transition:.15s}
.info .pop::before{content:"";position:absolute;left:50%;top:-6px;width:10px;height:10px;background:var(--panel);border-left:1px solid var(--border);border-top:1px solid var(--border);transform:translateX(-50%) rotate(45deg)}
.info:focus-within .pop,.info.open .pop{opacity:1;visibility:visible;transform:translate(-50%,0)}
.ask{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--hair);color:var(--primary);font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(4,1fr) 1.25fr;gap:12px}
.kpi{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:14px 14px 14px 18px;display:flex;align-items:center;gap:12px;overflow:hidden;cursor:pointer;transition:transform .16s}
.kpi:hover{transform:translateY(-2px)}
.kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--ac)}
.kpi .circ{width:40px;height:40px;border-radius:99px;display:grid;place-items:center;color:#fff;flex:none;background:var(--ac)}
.kpi .v{font-size:28px;line-height:1}
.kpi .l{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:3px}
/* month grid */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font:800 11px Manrope;letter-spacing:.08em;text-transform:uppercase;color:var(--subtle);padding:0 6px 2px}
.dow.we{color:oklch(68% 0.02 255)}
.day{position:relative;min-width:0;overflow:hidden;font:inherit;color:inherit;height:96px;border-radius:10px;background:var(--panel);border:1px solid var(--border);padding:7px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;text-align:left}
.day:hover{transform:translateY(-2px);border-color:oklch(54.6% 0.215 263 / .35);box-shadow:0 8px 22px -8px oklch(37.9% 0.146 266 / .18)}
.day.out{background:transparent;border-style:dashed;border-color:light-dark(oklch(90% 0.01 255), oklch(26% 0.01 255));cursor:default}
.day.out:hover{transform:none;box-shadow:none}
.day.out .dn{color:oklch(75% 0.015 255)}
.day.we:not(.out){background:light-dark(oklch(98.6% 0.004 255), oklch(15.1% 0.004 255))}
.dn{display:flex;align-items:center;gap:6px}
.dt{min-width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font:700 13px "Space Grotesk";color:var(--fg)}
.day.s-over{background:var(--over-light);border-color:light-dark(oklch(85% 0.07 20), oklch(32% 0.1 20))}
.day.s-due{background:var(--due-light);border-color:light-dark(oklch(87% 0.08 60), oklch(32% 0.1 60))}
.day.s-ok{background:var(--ok-light);border-color:light-dark(oklch(86% 0.06 170), oklch(32% 0.1 170))}
.day.s-up .dt{background:var(--navy);color:#fff}
.day.s-over .dt{background:var(--over);color:#fff}
.day.s-due .dt{background:var(--due);color:#fff}
.day.s-ok .dt{background:var(--ok);color:#fff}
.day.today{box-shadow:0 0 0 2px var(--navy)}
.day.today .tlabel{font:800 11px Manrope;letter-spacing:.04em;min-width:0;white-space:nowrap;text-transform:uppercase;color:var(--navy-ink,var(--navy));display:flex;align-items:center;gap:4px}
.pulse{width:7px;height:7px;border-radius:99px;background:var(--gold);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 oklch(80% 0.12 85 / .7)}50%{box-shadow:0 0 0 5px oklch(80% 0.12 85 / 0)}}
.ev{display:flex;align-items:center;gap:5px;height:20px;padding:0 6px 0 0;border-radius:4px;background:light-dark(oklch(100% 0 0 / .75), oklch(13% 0 0 / 0.75));font-size:11px;font-weight:700;color:var(--fg);overflow:hidden;white-space:nowrap}
.ev i{width:3px;align-self:stretch;flex:none;border-radius:4px 0 0 4px}
.ev .a{font:700 11px "IBM Plex Mono";color:var(--muted);flex:none}
.ev .t{overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;font-weight:800;color:var(--primary);padding-left:2px}
.day.sel{box-shadow:0 0 0 2px var(--primary),0 10px 24px -10px oklch(37.9% 0.146 266 / .3);z-index:2}
/* agenda */
.ag-date{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--hair)}
.ag-date:first-child{border-top:0}
.dtile{width:44px;height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;color:#fff}
.dtile b{font:700 18px/1 "Space Grotesk"}
.dtile small{font:800 11px Manrope;letter-spacing:.03em;text-transform:uppercase;opacity:.85;margin-top:2px}

function monthGrid({month='2026-10',rows=OCT,sel=null,empty=false}={}){
  const [y,m]=month.split('-').map(Number); const first=new Date(y,m-1,1); const days=new Date(y,m,0).getDate();
  const start=(first.getDay()+6)%7; // Monday first
  const byDate={}; rows.forEach(r=>(byDate[r.due]=byDate[r.due]||[]).push(r));
  let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<div class="dow ${i>4?'we':''}">${d}</div>`).join('');
  const prevDays=new Date(y,m-1,0).getDate();
  for(let i=0;i<start;i++) h+=`<div class="day out"><div class="dn"><span class="dt">${prevDays-start+1+i}</span></div></div>`;
  for(let d=1;d<=days;d++){
    const iso=`${month}-${String(d).padStart(2,'0')}`; const it=byDate[iso]||[]; const wd=(start+d-1)%7;
    const s=it.length?worst(it):''; const isToday=iso===TODAY;
    h+=`<button class="day ${wd>4?'we':''} ${s?'s-'+s:''} ${isToday?'today':''} ${sel===iso?'sel':''}" data-iso="${iso}" ${it.length?`data-tip="${fmt(iso,{weekday:'short',day:'numeric',month:'short'})} · ${it.length} filing${it.length>1?'s':''}"`:''} aria-label="${fmt(iso,{weekday:'long',day:'numeric',month:'long'})}, ${it.length} filings">
      <div class="dn"><span class="dt">${d}</span>${isToday?`<span class="tlabel"><span class="pulse"></span><span class="tl-t">Today</span></span>`:''}${it.length>1?`<span class="mono" style="margin-left:auto;font-size:11px;color:var(--muted)">${it.length}</span>`:''}</div>
      ${it.slice(0,2).map(r=>`<span class="ev" data-s="${status(r)}"><i style="background:var(${ST[status(r)].v})"></i><span class="a">${AREA_SHORT[r.area]}</span><span class="t">${r.name}</span></span>`).join('')}
      ${it.length>2?`<span class="more">+${it.length-2} more</span>`:''}

  }
  const tail=(7-((start+days)%7))%7; for(let i=1;i<=tail;i++) h+=`<div class="day out"><div class="dn"><span class="dt">${i}</span></div></div>`;

}

  pills&&pills.addEventListener('pick',e=>{const id=AREAS[e.detail].id;live.querySelectorAll('.ev').forEach(ev=>{const a=ev.querySelector('.a').textContent;ev.style.opacity=(id==='all'||AREA_SHORT[id]===a)?'1':'.18';});});
}

/* ---------- rule 14: hover tooltip + click drill-down (one component everywhere) ---------- */
const DD_TABS={status:[['all','All'],['ok','Filed'],['due','Due soon'],['over','Overdue'],['up','Upcoming']],area:[['all','All'],['MCA','MCA'],['GST','GST'],['IT','Income tax'],['PAY','Payroll'],['FEMA','FEMA']]};
const DD_TITLE={oct:'Compliances · October 2026',fil:'Filings · Sep–Oct 2026',fy:'Compliances · FY 2026-27'};
const SOLID={ok:'var(--ok-chip)',due:'var(--due-chip)',over:'var(--over-chip)',up:'oklch(54% 0.026 258)'};
function openDD(ab,kind,key,set){
  ab.querySelectorAll('.ddscrim,.dd').forEach(x=>x.remove());
  const rows=set==='oct'?OCT:FIL, tabs=DD_TABS[kind];
  const match=(r,k)=>k==='all'||(kind==='status'?status(r)===k:r.area===k);
  const on=Math.max(0,tabs.findIndex(t=>t[0]===key));
  const sc=document.createElement('div');sc.className='ddscrim';
  const d=document.createElement('div');d.className='dd';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');
  const onFil=/fil/.test(location.hash);
  const topBar=`<div class="dd-top" style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:9px 18px;background:var(--primary-light);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)"><span>These filings live in Compliances · Filings</span><a href="#" ${onFil?'data-ddlist':'data-go="filings"'} style="margin-left:auto;font-weight:800;font-size:12.5px;white-space:nowrap;color:var(--primary)">${onFil?'Show in the Filings list ↓':'Open Filings →'}</a></div>`;
  d.innerHTML=topBar+`<div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)"><div style="flex:1;font:700 15px Manrope;color:var(--navy-ink,var(--navy));display:flex;align-items:center;gap:4px">${DD_TITLE[set]}${infoBtn('As of 8 Oct 2026.')}</div><button class="ibtn" data-close aria-label="Close">${I.x(13)}</button></div>
   <div style="padding:16px 18px"><div class="seg-scroll dd-segw">${seg(tabs.map(t=>t[1]),on,{counts:tabs.map(t=>rows.filter(r=>match(r,t[0])).length)})}</div>
   <div class="dd-tw"><table style="margin-top:12px;font-size:12.5px"><thead><tr><th>Filing</th><th>Period</th><th>Area</th><th style="text-align:right">Due / filed</th><th>Status</th><th></th></tr></thead><tbody></tbody></table></div>
   <div data-foot style="font-size:11px;color:var(--muted);margin-top:8px"></div></div>
   <div style="display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border);background:var(--raised)"><button class="btn btn-o btn-s">Open Filings</button></div>`;
  const render=i=>{const k=tabs[i][0];const list=rows.filter(r=>match(r,k)).sort((a,b)=>a.due<b.due?-1:1);
    d.querySelector('table').style.display=list.length?'':'none';let eb=d.querySelector('.ddempty');if(!eb){eb=document.createElement('div');eb.className='ddempty';eb.style.padding='18px 4px 6px';d.querySelector('table').after(eb);}eb.innerHTML=list.length?'':botSay(k==='over'?'Nothing overdue. Nice work.':'No filings here yet.',{size:44,action:k==='over'?'':'Ask VCFO why'});
    d.querySelector('tbody').innerHTML=list.slice(0,7).map(r=>{const st=status(r);return `<tr data-open="${r.name}"><td>${nameWithLinks(r)} ${proofChip(r)}</td><td style="color:var(--muted)">${r.period}</td><td>${areaChip(r.area)}</td><td class="mono" style="text-align:right;font-size:12px">${r.filed?'Filed '+fmt(r.filed):fmt(r.due)}</td><td><span class="chip" style="background:${SOLID[st]};color:#fff">${ST[st].l}</span></td><td style="color:var(--subtle)">${I.chevR(14)}</td></tr>`}).join('');
    const full=set==='fy'?(k==='all'?FY_TOTAL:k==='ok'?FY_FILED:list.length):list.length;
    d.querySelector('[data-foot]').hidden=!list.length;d.querySelector('[data-foot]').textContent=list.length>7||full>list.length?`Showing ${Math.min(7,list.length)} of ${full} · full list in Filings`:`Showing all ${list.length}`;};
  ab.append(sc,d);wireSegs(d);render(on);
  d.querySelector('.seg').addEventListener('pick',e=>{e.stopPropagation();render(e.detail)});
  const close=()=>{sc.remove();d.remove()};sc.onclick=close;d.querySelector('[data-close]').onclick=close;
  const dl=d.querySelector('[data-ddlist]');if(dl)dl.onclick=e=>{e.preventDefault();close();const t=document.querySelector('#fil-redesign table')||document.querySelector('table');t&&t.scrollIntoView({behavior:'smooth',block:'start'});};
  d.addEventListener('click',e=>{const tr=e.target.closest('tr[data-open]');if(tr){const t=document.createElement('div');t.className='toast';t.innerHTML=`Opening ${tr.dataset.open} in Filings…`;ab.appendChild(t);setTimeout(()=>t.remove(),1600);}});
}

document.addEventListener('click',e=>{const pv=e.target.closest&&e.target.closest('[data-proof]');if(pv){e.stopPropagation();e.preventDefault();const ab=pv.closest('.ab');const w=document.createElement('div');w.className='pvwrap';w.style.cssText='position:absolute;inset:0;z-index:120';w.innerHTML=docPreview();ab.appendChild(w);w.querySelector('[data-close-pv]').onclick=()=>w.remove();w.querySelector('.scrim').onclick=()=>w.remove();return;}},true);
const tipEl=document.createElement('div');tipEl.className='tipb';document.body.appendChild(tipEl);
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip],button[aria-label].ibtn');if(!t){tipEl.classList.remove('on');return;}const r=t.getBoundingClientRect();tipEl.textContent=t.dataset.tip||t.getAttribute('aria-label');tipEl.style.left=(r.left+r.width/2)+'px';tipEl.style.top=r.top+'px';tipEl.classList.add('on');});
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-dd]');if(!t||t.closest('.dd'))return;tipEl.classList.remove('on');openDD(t.closest('.ab'),t.dataset.dd,t.dataset.k,t.dataset.set);});
// static demo board: Filings donut "Due soon" clicked + a hover tooltip on the area bars
const demo=document.querySelector('#fil-drill .ab');
const tipHost=document.querySelector('#fil-redesign .ab');
if(demo){/* v5: no static demo tooltip on the live Filings page */
  const cdemo=document.querySelector('#cal-drill .ab');if(cdemo)openDD(cdemo,'status','over','oct');
  openDD(demo,'status','due','fil');}
// rule 17: every icon-only control explains itself (tooltip = aria-label)
document.querySelectorAll('button[aria-label]:not([data-tip]),a[aria-label]:not([data-tip])').forEach(b=>{if(!b.textContent.trim()||b.querySelector('svg')&&b.textContent.trim().length<2)b.dataset.tip=b.getAttribute('aria-label');});
document.querySelectorAll('.ibtn:not([aria-label]):not([data-tip])').forEach(b=>{const t=b.innerHTML.includes('M6 6l12 12')?'Close':b.innerHTML.includes('M15 6l-6 6')?'Previous':b.innerHTML.includes('M9 6l6 6')?'Next':b.innerHTML.includes('M12 4v11')?'Download':b.innerHTML.includes('M2.5 12S6')?'Preview':'';if(t){b.dataset.tip=t;b.setAttribute('aria-label',t);}});
// count-up
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelectorAll('[data-count]').forEach(el=>{const t=+el.dataset.count;let s=null;const step=ts=>{s=s||ts;const k=Math.min(1,(ts-s)/700);el.textContent=Math.round(t*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});}
</script>
