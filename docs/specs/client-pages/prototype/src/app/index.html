<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VCFO Suite — Client Portal · Prototype</title>
<link rel="icon" type="image/png" href="brand/vcfo-icon.png">
<style>
:root{--bg:#ffffff;--fg:#0f2a4a;--muted:#5b6b82;--track:#eef1f5;--bar:#e76028}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#ffffff;--fg:#0f2a4a}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:600 14px/1.4 Manrope,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:0 16px;box-sizing:border-box}
.l{display:flex;flex-direction:column;align-items:center;gap:22px;animation:in .4s cubic-bezier(.22,1,.36,1) both}
.l img{display:block;height:52px;width:auto;max-width:80vw;object-fit:contain}
.b{width:180px;height:3px;border-radius:99px;background:var(--track);overflow:hidden}
.b i{display:block;width:40%;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffc517,#f08a21,var(--bar));animation:run 1.1s cubic-bezier(.45,0,.25,1) infinite}
.l span{color:var(--muted);font-weight:600;font-size:13px}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.b i,.l{animation:none}}
</style>
</head>
<body>
<div class="l" role="status" aria-live="polite"><img src="brand/vcfo-logo-on-white.png" alt="VCFO Suite by SBC" width="234" height="52"><div class="b" aria-hidden="true"><i></i></div><span>Opening your client portal…</span></div>
<script src="routes.js"></script>
<script>
(function(){
  var R=window.__VCFO_ROUTES, h=(location.hash||'#/home').replace(/^#\/?/,'')||'home';
  var dev; try{dev=JSON.parse(localStorage.getItem('vcfo.device'))}catch(e){}
  dev=dev||(innerWidth<700?'mobile':'desktop');
  var r=R[h]||R.home; var p=(dev==='mobile'&&r.m)?r.m:r.d;
  setTimeout(function(){location.replace(p);},350);
})();
</script>
</body>
</html>
