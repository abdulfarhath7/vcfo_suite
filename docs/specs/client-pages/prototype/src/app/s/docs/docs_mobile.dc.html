<style>

:root{--bg:oklch(97.4% 0.006 255);--panel:oklch(100% 0 0);--raised:oklch(96.6% 0.007 255);--border:oklch(92.2% 0.011 255);--hair:oklch(94.8% 0.007 255);--fg:oklch(21% 0.042 264);--muted:oklch(46% 0.028 258);--subtle:oklch(55% 0.022 255);

--navy:#0f2a4a;--navy-2:#17396b;--gold:#c9a24b;--gold-soft:#fbf3df;--gold-text:#6e500f;

a{color:var(--primary);text-decoration:none;font-weight:700}
.card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}

.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:2px;border-radius:8px;background:oklch(96.5% 0.008 250);box-shadow:inset 0 0 0 1px var(--border)}
.seg>.thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:5px;background:var(--navy);transition:transform .42s linear(0,0.0637,0.2021,0.3619,0.5141,0.6451,0.7506,0.8315,0.8909,0.9328,0.9613,0.9799,0.9914,0.9981,1.0016,1.0032,1.0036,1.0034,1.0029,1.0023,1.0018,1.0013,1.0009,1.0006,1.0004)}
.seg button{position:relative;z-index:1;border:0;background:none;height:36px;border-radius:5px;font:500 12.5px Manrope,sans-serif;color:oklch(50% 0.022 255);cursor:pointer}
.seg button.on{color:#fff}
.ft{position:relative;width:30px;height:36px;flex:none;border-radius:4px;background:var(--ftl);box-shadow:inset 0 0 0 1px var(--ftb)}
.ft::after{content:"";position:absolute;right:0;top:0;width:9px;height:9px;border-radius:0 4px 0 3px;background:linear-gradient(225deg,var(--panel) 50%,var(--ftb) 50%)}

.drop{border:1.5px dashed oklch(66% 0.17 48 / .55);border-radius:8px;background:oklch(96.8% 0.04 55 / .5);display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.drop a{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:6px;background:var(--panel);box-shadow:inset 0 0 0 1px oklch(66% 0.17 48 / .35);color:var(--due-text);font-size:12.5px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid oklch(54.6% 0.215 263 / .4);outline-offset:2px}
@keyframes v7bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

@media (prefers-reduced-motion: reduce){.seg>.thumb{transition:none}.bob{animation:none}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { g: 0 }; }
  renderVals() {
    const s = this.state || {};
    const FT = { PDF: '--ftl:var(--over-light);--ftb:oklch(57% 0.2 22 / .35);--ftc:var(--over-chip)', JPG: '--ftl:var(--teal-light);--ftb:oklch(55% 0.1 195 / .35);--ftc:var(--teal-chip)', DOCX: '--ftl:var(--prog-light);--ftb:oklch(55% 0.16 252 / .35);--ftc:var(--prog-chip)' };
    const STS = { Approved: 'background:var(--ok-light);color:var(--ok-text)', 'In review': 'background:var(--prog-light);color:var(--prog-text)', Final: 'background:var(--navy);color:#fff' };
    const D = [
      ['PAN card — Ravi Kumar', 'PDF', 6, 'Director KYC', 'Identity & KYC', 'You', '14 Sep', 'Approved'],
      ['Passport — Meera Shah', 'PDF', 6, 'Director KYC', 'Identity & KYC', 'You', '14 Sep', 'Approved'],
      ['Photograph — Meera Shah', 'JPG', 6, 'Director KYC', 'Identity & KYC', 'You', '15 Sep', 'Approved'],
      ['Utility bill — office', 'PDF', 8, 'Registered Office', 'Office address', 'You', '22 Sep', 'Approved'],
      ['Rent agreement', 'DOCX', 8, 'Registered Office', 'Office address', 'You', '23 Sep', 'Approved'],
      ['Certificate of Incorporation', 'PDF', 17, 'Certificate of Incorporation', 'Certificates', 'SBC', '24 Oct', 'Final'],
      ['MoA and AoA (stamped)', 'PDF', 17, 'Certificate of Incorporation', 'Certificates', 'SBC', '24 Oct', 'Final'],
      ['FIRC from the bank', 'PDF', 21, 'Share Capital Infusion', 'Banking & capital', 'You', '2 Nov', 'Approved'],
      ['Apostilled parent COI', 'PDF', 22, 'Share Certificates', 'Company records', 'You', '6 Nov', 'In review']
    ];
    const rows = D.map((d) => ({ name: d[0], type: d[1], stepNo: d[2], step: d[3], cat: d[4], src: d[5], date: d[6], status: d[7], ftStyle: FT[d[1]], stStyle: STS[d[7]] }));
    let groups = [];
    if (s.g === 2) groups = [{ n: '·', title: 'Latest', count: rows.length, docs: rows.slice().reverse(), nStyle: 'background:var(--panel);color:var(--muted)' }];
    else {
      const key = s.g === 0 ? 'step' : 'cat'; const seen = {};
      rows.forEach((r) => { if (!seen[r[key]]) { seen[r[key]] = { r, docs: [] }; groups.push(seen[r[key]]); } seen[r[key]].docs.push(r); });
      groups.forEach((g) => { g.n = s.g === 0 ? String(g.r.stepNo) : g.r.cat.slice(0, 2).toUpperCase(); g.title = s.g === 0 ? g.r.step : g.r.cat; g.count = g.docs.length; g.nStyle = s.g === 0 ? 'background:var(--ok-chip);color:#fff' : 'background:var(--primary-light);color:var(--navy)'; });
    }
    return {
      gTabs: ['By step', 'By category', 'Latest'].map((l, i) => ({ label: l, cls: s.g === i ? 'on' : '', sel: s.g === i ? 'true' : 'false', pick: () => this.setState({ g: i }) })),
      gThumb: 'transform:translateX(' + (s.g * 100) + '%)',
      groups
    };
  }
}
</script>
