<div style="width:100%;box-sizing:border-box;font-family:Manrope,system-ui,sans-serif;color:var(--fg);font-size:13px">
<section class="card" style=""><div style="display:flex;align-items:center;gap:8px;padding:14px 16px 0"><h3 style="margin:0;font:700 13px Manrope,sans-serif;color:var(--navy)">Recent activity</h3><div style="margin-left:auto;display:flex;gap:6px;align-items:center"><div class="seg" role="tablist" style="grid-template-columns:repeat(3,minmax(0,1fr));"><span class="thumb" style="width:calc((100% - 4px)/3);{{thumb}}"></span><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" onClick="{{t.pick}}" class="{{t.cls}}">{{t.label}}<span class="cnt">{{t.cnt}}</span></button></sc-for></div></div></div><div style="padding:6px 16px 12px"><sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div style="display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--hair)"><span class="mono" style="font-size:12px;font-weight:600">{{r.d}}</span><span class="rt" style="font-weight:600">{{r.t}}</span><span class="cap">{{r.w}}</span></div></sc-for></div></section>
</div>
</template></x-dc><script>(function(){var x=document.querySelector("x-dc"),t=x&&x.firstElementChild;if(t&&t.tagName==="TEMPLATE"){x.replaceChildren(document.adoptNode(t.content));}})();</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":300}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = {"tab": 0}; }
  renderVals() {
    const s = this.state || {};
    const A = [["5 Oct 2026", "2 documents requested", "Arjun Mehta", "sbc"], ["4 Oct 2026", "Proposed Directors saved", "You", "you"], ["3 Oct 2026", "Passport copy sent back", "Arjun Mehta", "sbc"], ["1 Oct 2026", "Capital Structure accepted", "Priya Raman", "sbc"]];const TABS = [['All', 4], ['SBC', 3], ['You', 1]];
    const tabs = TABS.map((t, i) => ({ label: t[0], cnt: t[1], cls: s.tab === i ? 'on' : '', pick: () => this.setState({ tab: i }) }));
    const thumb = 'transform:translateX(' + (s.tab * 100) + '%)';
const rows = A.filter((a) => s.tab === 0 || (s.tab === 1 && a[3] === 'sbc') || (s.tab === 2 && a[3] === 'you')).map((a) => ({ d: a[0], t: a[1], w: a[2] }));return { tabs, thumb, rows };
  }
}
</script>
