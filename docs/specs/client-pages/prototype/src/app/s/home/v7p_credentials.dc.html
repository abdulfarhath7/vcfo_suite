  function addRow() {
    var T = T_(S.tab), r = T.rows.length, row = T.cols.map(function (c) { return c.k === 'status' ? 'Pending' : ''; });
    T.rows.push(row);
    audit(WHO + ' added row ' + (r + 1) + ' to ' + tabLabel(S.tab));
    renderAll({ td: T.id + '|' + r + '|' + T.lab, scroll: 'bottom' });
    toast('Row added', true, function () {
      if (T.rows.length - 1 !== r || T.rows[r] !== row) return;
      T.rows.pop();
      if (S.edit && S.edit.indexOf(T.id + '|' + r + '|') === 0) S.edit = null;
      audit(WHO + ' removed row ' + (r + 1) + ' from ' + tabLabel(S.tab));
      renderAll(null);
    });
  }
  function copyKey(key) {
    var v = getVal(key);
    var ok = function () { toast('Copied'); };
    var fb = function () {
      try {
        var ta = document.createElement('textarea');
        ta.value = v; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta); ta.select();
        var okc = document.execCommand('copy');
        document.body.removeChild(ta);
        if (okc) ok(); else toast('Copy blocked by this browser');
      } catch (x) { toast('Copy blocked by this browser'); }
    };
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(v).then(ok, fb); return; } } catch (x) {}
    fb();
  }
  function applyStage(st, spec) {
    if (S.stage === st) { if (spec) refocus(spec); return; }
    S.stage = st; S.edit = null;
    renderAll(spec || null);
  }
  function setStage(st) {
    var after = st === 'after', here = window.vcfoHere ? window.vcfoHere() : null;
    if (window.vcfoSetAfter && here && here.indexOf('home') !== 0) window.vcfoSetAfter(after);   // keeps the top-bar pill in step; fires vcfo-after
    else { try { localStorage.setItem('vcfo.after', JSON.stringify(after)); } catch (e) {} }
    applyStage(st, { act: 'stage', key: st });
  }

  /* ---------- actions ---------- */
  function act(name, el) {
    var key = el.getAttribute('data-key');
    switch (name) {
      case 'home': go('home'); break;
      case 'audit': go('audit'); break;
      case 'search': toast('Search opens from the shell in the full app'); break;
      case 'announce': go('announcements'); break;
      case 'notif': go('notifications'); break;
      case 'theme': toast('Theme follows the shell in the full app'); break;
      case 'stage': setStage(key); break;
      case 'tab': S.tab = key; renderAll({ act: 'tab', key: key }); break;
      case 'log': S.log = true; renderDrawer(); focusById('cr-log-x'); break;
      case 'log-close': S.log = false; renderDrawer(); refocus({ act: 'log' }); break;
      case 'preview': openOtp('preview', key, { act: 'preview', key: key }); break;
      case 'editmode': openOtp('edit', key, { act: 'editmode', key: key }); break;
      case 'lock': endScope(key); renderAll({ act: key === 'page' || key.indexOf('tab:') === 0 ? 'preview' : 'lock', key: key }); break;
      case 'row-preview': {
        var sp = 'row:' + key;
        if (modeOf(sp)) { endScope(sp); renderAll({ act: 'row-preview', key: key }); }
        else openOtp('preview', sp, { act: 'row-preview', key: key });
        break;
      }
      case 'row-edit': {
        var se = 'row:' + key;
        if (live(S.ed, se)) { endScope(se); renderAll({ act: 'row-edit', key: key }); }
        else openOtp('edit', se, { act: 'row-edit', key: key });
        break;
      }
      case 'reveal-cell': openOtp('reveal', 'cell:' + key, { act: 'reveal-cell', key: key }); break;
      case 'hide': delete S.pv['cell:' + key]; renderAll({ act: 'reveal-cell', key: key }); break;
      case 'add-dir': needEdit('tab:kyc', addDirector); break;
      case 'add-row': needEdit('tab:' + T_(S.tab).id, addRow); break;
      case 'copy': copyKey(key); break;
      case 'info': toast(labelOf(key) + ': masked. Preview or Reveal needs an OTP from ' + MGR + '.'); break;
      case 'cert': toast('Opens the certificate in the full app'); break;
      case 'tip': { var w = el.closest('.cr-tipw'), open = w.classList.toggle('open'); el.setAttribute('aria-expanded', String(open)); break; }
      case 'otp-close': closeOtp(); break;
      case 'otp-verify': verify(); break;
      case 'otp-resend': resend(); break;
    }
  }

  /* ---------- delegated events ---------- */
  function onClick(e) {
    var el = e.target;
    if (!el || !el.closest) return;
    if (el.closest('select')) return;
    var a = el.closest('[data-act]');
    if (a && !a.disabled) {
      a.setAttribute('data-hit', String(Date.now()));   // a DOM reaction, so the prototype does not flag toast-only controls as dead
      act(a.getAttribute('data-act'), a);
      return;
    }
    var td = el.closest('td[data-edit],th[data-edit]');
    if (td) { var k = td.getAttribute('data-edit'); if (S.edit !== k) startEdit(k); }
  }
  function onKey(e) {
    var t = e.target;
    if (t && t.id === 'cr-ed') {
      if (e.key === 'Enter' && !(t.tagName === 'TEXTAREA' && e.shiftKey)) { e.preventDefault(); commitEdit(t.value, false); return; }
      if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); return; }
      return;
    }
    if (e.key === 'Escape') {
      if (S.otp) { e.preventDefault(); closeOtp(); return; }
      if (S.log) { e.preventDefault(); S.log = false; renderDrawer(); refocus({ act: 'log' }); return; }
    }
    if (t && t.hasAttribute && t.hasAttribute('data-otp')) { otpKey(e, t); return; }
    if (t && (t.tagName === 'TD' || t.tagName === 'TH') && t.hasAttribute('data-edit') && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); startEdit(t.getAttribute('data-edit')); return;
    }
    if (e.key === 'Tab' && S.otp) trap(e);
  }
  function fillOtp(digits) {
    var o = S.otp;
    if (!o) return;
    for (var k = 0; k < 6; k++) { o.d[k] = digits[k] || ''; var el = document.getElementById('cr-o' + k); if (el) el.value = o.d[k]; }
    syncVerify();
    var next = o.d.indexOf('');
    if (next === -1) focusById('cr-verify'); else focusOtp(next);
  }
  function otpKey(e, t) {
    var o = S.otp;
    if (!o) return;
    var i = +t.getAttribute('data-otp');
    if (e.key === 'Backspace' && !o.d[i] && i > 0) {
      e.preventDefault(); o.d[i - 1] = '';
      var p = document.getElementById('cr-o' + (i - 1)); if (p) p.value = '';
      focusOtp(i - 1); syncVerify();
    } else if (e.key === 'ArrowLeft' && i > 0) { e.preventDefault(); focusOtp(i - 1); }
    else if (e.key === 'ArrowRight' && i < 5) { e.preventDefault(); focusOtp(i + 1); }
    else if (e.key === 'Enter') { e.preventDefault(); verify(); }
  }
  function onInput(e) {
    var t = e.target;
    if (!t || !t.hasAttribute || !t.hasAttribute('data-otp') || !S.otp) return;
    var raw = (t.value || '').replace(/\D/g, '');
    if (raw.length > 1) { fillOtp(raw.slice(0, 6).split('')); return; }
    var i = +t.getAttribute('data-otp');
    S.otp.d[i] = raw; t.value = raw; syncVerify();
    if (raw) { if (i < 5) focusOtp(i + 1); else focusById('cr-verify'); }
  }
  function onPaste(e) {
    var t = e.target;
    if (!t || !t.hasAttribute || !t.hasAttribute('data-otp') || !S.otp) return;
    var cd = e.clipboardData || window.clipboardData, ds = ((cd ? cd.getData('text') : '') || '').replace(/\D/g, '').slice(0, 6);
    if (!ds) return;
    e.preventDefault(); fillOtp(ds.split(''));
  }
  function onFocusOut(e) { var t = e.target; if (t && t.id === 'cr-ed' && S.edit) commitEdit(t.value, true); }
  function onFocusIn(e) { if (!S.otp) return; var dlg = document.getElementById('cr-dlg'); if (dlg && !dlg.contains(e.target)) focusOtp(0); }
  function onChange(e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'cr-tabsel') { S.tab = t.value; renderAll({ id: 'cr-tabsel' }); return; }
    var sk = t.getAttribute && t.getAttribute('data-status');
    if (sk && editable(sk) && t.value !== getVal(sk)) { var v = t.value; saveChange(sk, v, function (l) { return 'changed ' + l + ' to ' + v; }); }
  }
  function onAfter(e) { applyStage(e && e.detail ? 'after' : 'before', null); }

  /* ---------- clock: countdowns and expiry ---------- */
  function tick() {
    var now = Date.now(), expired = false;
    [S.pv, S.ed].forEach(function (map) { Object.keys(map).forEach(function (k) { if (map[k] <= now) { delete map[k]; expired = true; } }); });
    var els = document.querySelectorAll('[data-cd]');
    for (var i = 0; i < els.length; i++) {
      var sc = els[i].getAttribute('data-cd'), u = untilOf(sc);
      if (u) els[i].textContent = (els[i].getAttribute('data-cdp') || '') + fmtS(u - now);
    }
    if (expired) { if (S.edit && !editable(S.edit)) S.edit = null; if (!S.edit) renderAll(null); }
    if (S.otp) {
      var o = S.otp;
      if (o.lockUntil) {
        if (o.lockUntil <= now) { o.lockUntil = 0; o.wrong = 0; o.err = ''; o.info = ''; o.d = ['', '', '', '', '', '']; renderOtp(0); }
        else { var lk = document.querySelector('[data-otp-lock]'); if (lk) lk.textContent = fmtS(o.lockUntil - now); }
      }
      var rb = document.getElementById('cr-resend');
      if (rb && rb.disabled && !o.lockUntil) {
        if (o.resendUntil <= now) renderOtp(null);
        else { var sp = rb.querySelector('[data-otp-resend]'); if (sp) sp.textContent = fmtS(o.resendUntil - now); }
      }
    }
    var root = document.getElementById('creds-root');
    if (root && !root.firstChild) renderAll(null);
  }

  /* ---------- boot (waits for the DC runtime to mount #creds-root) ---------- */
  function boot() {
    if (!document.getElementById('creds-root')) { setTimeout(boot, 30); return; }
    if (booted) return;
    booted = true;
    S.data = seed();
    S.audit = loadAudit();
    S.stage = readAfter() ? 'after' : 'before';
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    document.addEventListener('input', onInput);
    document.addEventListener('paste', onPaste);
    document.addEventListener('focusout', onFocusOut);
    document.addEventListener('focusin', onFocusIn);
    document.addEventListener('change', onChange);
    document.addEventListener('vcfo-after', onAfter);
    window.addEventListener('resize', function () { fixGrid(null); });
    setInterval(tick, 1000);
    renderAll(null); renderOtp(null); renderDrawer();
  }
  window.__credsBoot = boot;
  boot();
})();
</script>
</body>
