<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Clients</title>
<script src="./support.js"></script>
<script src="./data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
/*@admin-css*/
</style>
</helmet>
<div class="L" style="display: flex; flex-wrap: wrap; min-height: 100vh; position: relative">
  <div style="flex: 1 1 248px; max-width: 248px; background: #0f2a4a"><dc-import name="Side" active="clients" mode="{{mode}}" hint-size="248px,1000px"></dc-import></div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="Top" crumb="Today › Clients" mode="{{mode}}" on-mode="{{setMode}}" hint-size="100%,56px"></dc-import>
    <main style="max-width: 1400px; width: 100%; margin: 0 auto; padding: 18px clamp(12px, 2vw, 28px) 110px; display: flex; flex-direction: column; gap: 16px">

      <div class="ds-bar">
        <!--scrim-->
        <span class="cnt" style="height: 28px; padding: 0 10px; font-size: 12px">{{nRows}} of {{nAll}} clients</span>
        <!--dd:dM:Manager-->
        <!--dd:dS:Stage-->
        <!--dd:dH:Health-->
        <sc-if value="{{anyF}}" hint-placeholder-val="{{false}}"><button type="button" class="lnk" onClick="{{clearF}}">Clear</button></sc-if>
        <button type="button" class="btn btnp" data-admin-assign="client" style="margin-left: auto">Assign client</button>
      </div>

      <section class="card" data-card="all-clients">
        <div class="sc">
          <table class="tbl" style="min-width: 1080px">
            <thead><tr><th>Client</th><th>Now at</th><th>Progress</th><th>Manager</th><th>Project lead</th><th>Stage</th><th>Next</th><th>Health</th></tr></thead>
            <tbody>
              <sc-for list="{{rows}}" as="r" hint-placeholder-count="14">
                <tr class="go" data-go="admin-overview" title="Open {{r.name}}">
                  <td><span class="nm"><span class="ct" style="{{r.ct}}">{{r.k}}</span><b>{{r.name}}</b></span></td>
                  <td><b style="font-weight: 600">{{r.step}}</b><span class="sub"><span class="mono">{{r.code}}</span></span></td>
                  <td><span style="display: flex; align-items: center; gap: 8px"><span class="pb" title="{{r.pct}} of 48 steps"><sc-for list="{{r.segs}}" as="g" hint-placeholder-count="4"><span style="{{g.st}}" title="{{g.tip}}"></span></sc-for></span><span class="mut" style="font-size: 12px">{{r.pct}}</span></span></td>
                  <td><span class="nm"><span class="pt">{{r.mIni}}</span>{{r.mgr}}</span></td>
                  <td>{{r.lead}}</td>
                  <td><span class="chip" style="{{r.stS}}; min-width: 104px">{{r.stage}}</span></td>
                  <td>{{r.next}}</td>
                  <td><span class="chip sol" style="{{r.hlS}}">{{r.hl}}</span></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
          <sc-if value="{{noRows}}" hint-placeholder-val="{{false}}"><div class="empty">No client matches these filters. Clear a filter to see more.</div></sc-if>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const A = window.ADM, s = this.state || {}, set = (o) => this.setState(o);
    if (!this.__l) { this.__l = 1; window.addEventListener('vcfo:assign', () => this.setState({ t: Date.now() })); }
    const mode = s.mode || 'mixed', dd = s.dd || '', fM = s.fM || '', fS = s.fS || '', fH = s.fH || '';
    const all = A.clients(), M = (id) => A.MGR[id] || { name: '', ini: '' };
    const SO = { stuck: 0, over: 1, due: 2, wait: 3, run: 4, none: 5 };
    const pick = all.filter(c => (!fM || c.mgr === fM) && (!fS || c.stage === fS) && (!fH || c.health === fH)).sort((a, b) => SO[a.health] - SO[b.health] || a.name.localeCompare(b.name));
    const rows = pick.map(c => ({ k: c.k, name: c.name, ct: 'background:' + c.soft + ';color:' + c.ink,
      stage: c.stage === 'inc' ? 'Incorporating' : 'Compliance', stS: c.stage === 'inc' ? 'background:#ffeedc;color:#9b3b08' : 'background:#e1f3ec;color:#0f6e51',
      step: c.step, code: c.code, pct: c.pct + '%', segs: A.phaseBar(c.phases), mgr: M(c.mgr).name, mIni: M(c.mgr).ini, lead: c.lead,
      ball: c.ball + ' · ' + c.days + 'd', ballS: A.OWN[c.ball], next: c.next, hl: A.HEALTH[c.health][0], hlS: 'background:' + A.HEALTH[c.health][1] }));
    return Object.assign({ mode, setMode: (x) => set({ mode: x }), rows, nRows: rows.length, nAll: all.length, noRows: rows.length === 0,
      anyF: !!(fM || fS || fH), clearF: () => set({ fM: '', fS: '', fH: '' }), ddAny: !!dd, ddClose: () => set({ dd: '' }) },
      A.dd('dM', dd, 'm', 'fM', fM, Object.keys(A.MGR).map(id => [id, M(id).name]), 'All managers', set),
      A.dd('dS', dd, 's', 'fS', fS, [['inc', 'Incorporating'], ['cmp', 'Compliance']], 'All stages', set),
      A.dd('dH', dd, 'h', 'fH', fH, Object.keys(A.HEALTH).map(k => [k, A.HEALTH[k][0], A.HEALTH[k][1]]), 'Any health', set));
  }
}
</script>
<script src="../../routes.js"></script><script src="../../proto.js"></script>
</body>
</html>
