<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Developer · Data and costs</title>
<script src="./support.js"></script>
<script src="./data.js"></script>
<script src="./devdata.js"></script>
<script src="./confirm.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
/*@admin-css*/
/*@super-css*/
/*@dev-css*/
</style>
</helmet>
<div class="L" style="display: flex; flex-wrap: wrap; min-height: 100vh; position: relative">
  <div style="flex: 1 1 248px; max-width: 248px; background: #0f2a4a"><dc-import name="Side" active="data" mode="{{mode}}" hint-size="248px,1000px"></dc-import></div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="Top" crumb="Overview › Data and costs" mode="{{mode}}" on-mode="{{setMode}}" hint-size="100%,56px"></dc-import>
    <main style="max-width: 1400px; width: 100%; margin: 0 auto; padding: 18px clamp(12px, 2vw, 28px) 110px; display: flex; flex-direction: column; gap: 16px">

      <div class="cols2">
        <section class="card" data-card="data">
          <div class="ch"><span class="tile"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-4.4 0-8 1.3-8 3v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6c0-1.7-3.6-3-8-3z M4 6c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg></span><h2 class="st">Data and backups</h2><button type="button" class="btn" data-dev-confirm="Test a restore" data-what="Restore the latest backup to a scratch database and check it opens" data-before="Last test 1 Oct" data-after="Test running" data-toast="Restore test started" style="margin-left: auto">Test a restore</button></div>
          <sc-for list="{{data}}" as="x" hint-placeholder-count="6"><div class="kv"><span><b style="font-weight: 600; display: block">{{x.k}}</b><span class="sub">{{x.d}}</span></span><b style="font-weight: 600">{{x.v}}</b></div></sc-for>
        </section>
        <section class="card" data-card="volume">
          <div class="ch"><span class="tile"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z m18 3-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></span><h2 class="st">Volumes · October</h2></div>
          <div class="kg" style="grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 0 16px 16px"><sc-for list="{{vol}}" as="x" hint-placeholder-count="4"><div><b>{{x.n}}</b><em>{{x.k}} · {{x.d}}</em></div></sc-for></div>
        </section>
      </div>
      <section class="card" data-card="costs">
        <div class="ch"><span class="tile"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18v12H3z M12 9.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5"></path></svg></span><h2 class="st">Costs this month</h2><span class="mut" style="margin-left: auto; font-size: 12px">{{costLine}}</span></div>
        <div class="rows" style="gap: 12px"><sc-for list="{{costs}}" as="c" hint-placeholder-count="8"><div class="hbar" style="grid-template-columns: 180px minmax(0, 1fr) 190px"><span>{{c.k}}</span><span class="trk" style="height: 10px"><span style="{{c.bar}}"></span></span><span class="money" style="text-align: right; {{c.st}}">{{c.t}}</span></div></sc-for></div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const D = window.DEV, A = window.ADM, s = this.state || {}, set = (o) => this.setState(o), dd = s.dd || '';
    if (!this.__l) { this.__l = 1; window.addEventListener('vcfo:devaudit', () => this.setState({ t: Date.now() })); }
    const toast = (m) => { if (window.vcfoToast) window.vcfoToast(m); };
    const ST = { ok: ['Working', '#0f6e51'], warn: ['Needs attention', '#be4400'], down: ['Down', '#b5302a'], connected: ['Connected', '#0f6e51'], attention: ['Needs attention', '#be4400'], off: ['Not connected', '#656f7e'], missing: ['Missing', '#b5302a'], fail: ['Failed', '#b5302a'], skip: ['Skipped', '#be4400'], pending: ['Waiting for approval', '#be4400'], approved: ['Approved', '#0f6e51'], pass: ['Passing', '#0f6e51'] };
    const chip = (k) => 'background:' + (ST[k] || ST.ok)[1];
    const base = { mode: s.mode || 'mixed', setMode: (m) => set({ mode: m }) };

    const data = D.DATA.map(x => ({ k: x[0], v: x[1], d: x[2] }));
    const vol = D.VOLUME.map(x => ({ k: x[0], n: x[1].toLocaleString('en-IN'), d: x[2] }));
    const tot = D.COSTS.reduce((a, c) => a + c[1], 0), bud = D.COSTS.reduce((a, c) => a + c[2], 0);
    const costs = D.COSTS.map(c => { const p = c[1] / c[2]; return { k: c[0], t: A.rupees(c[1]) + ' of ' + A.rupees(c[2]), bar: 'width:' + Math.min(100, p * 100) + '%;background:' + (p > .9 ? '#be4400' : '#1b4f94'), st: p > .9 ? 'color:#be4400;font-weight:600' : '' }; });
    return Object.assign(base, { data, vol, costs, costLine: A.rupees(tot) + ' of a ' + A.rupees(bud) + ' budget · ' + Math.round(tot / bud * 100) + '% used with 15 days to go' });
  }
}
</script>
<script src="../../routes.js"></script><script src="../../proto.js"></script>
</body>
</html>
