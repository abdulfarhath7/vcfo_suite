<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Developer · Messages</title>
<script src="./support.js"></script>
<script src="./data.js"></script>
<script src="./devdata.js"></script>
<script src="./confirm.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
/*@admin-css*/
/*@super-css*/
/*@dev-css*/
</style>
</helmet>
<div class="L" style="display: flex; flex-wrap: wrap; min-height: 100vh; position: relative">
  <div style="flex: 1 1 248px; max-width: 248px; background: #0f2a4a"><dc-import name="Side" active="messages" mode="{{mode}}" hint-size="248px,1000px"></dc-import></div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="Top" crumb="Overview › Messages" mode="{{mode}}" on-mode="{{setMode}}" hint-size="100%,56px"></dc-import>
    <main style="max-width: 1400px; width: 100%; margin: 0 auto; padding: 18px clamp(12px, 2vw, 28px) 110px; display: flex; flex-direction: column; gap: 16px">

      <div class="ds-bar">
        <!--scrim-->
        <!--dd:dC:Channel-->
        
      </div>
      <section class="card" data-card="routes">
        <div class="ch"><span class="tile"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z m18 3-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg></span><h2 class="st">Message routes</h2><span class="cnt">{{nRows}}</span></div>
        <div class="sc"><table class="tbl" style="min-width: 1060px">
          <thead><tr><th>Message</th><th>Channel</th><th>Sent from</th><th>Template</th><th>To</th><th style="text-align: right">7 days</th><th style="text-align: right">Delivered</th><th></th></tr></thead>
          <tbody><sc-for list="{{rows}}" as="x" hint-placeholder-count="13"><tr>
            <td><b style="font-weight: 600">{{x.type}}</b><span class="sub">{{x.when}}</span></td>
            <td><span class="chip" style="background: #eef2f7; color: #0f2a4a; min-width: 84px">{{x.ch}}</span></td>
            <td class="mono2">{{x.from}}</td>
            <td><span class="mono2" style="display: block">{{x.tpl}}</span><span class="chip" style="{{x.tcs}}; color: #fff; margin-top: 3px">{{x.tsl}}</span></td>
            <td style="white-space: normal; max-width: 150px">{{x.to}}</td><td style="text-align: right">{{x.sent}}</td><td style="text-align: right; {{x.dSt}}">{{x.del}}</td>
            <td><span style="display: flex; gap: 6px; justify-content: flex-end"><button type="button" class="btn" data-dev-confirm="Test" data-what="{{x.testWhat}}" data-before="-" data-after="Test sent" data-toast="{{x.testToast}}">Test</button><button type="button" class="btn" data-dev-confirm="Edit" data-what="{{x.editWhat}}" data-before="{{x.from}}" data-after="{{x.editAfter}}" data-toast="Route saved · this is a prototype">Edit</button></span></td>
          </tr></sc-for></tbody>
        </table></div>
      </section>
      <div class="cols2">
        <section class="card" data-card="domain">
          <div class="ch"><span class="tile"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"></path></svg></span><h2 class="st">Email domain · sbcllp.in</h2></div>
          <sc-for list="{{dom}}" as="x" hint-placeholder-count="4"><div class="kv"><span><b style="font-weight: 600; display: block">{{x.k}}</b><span class="sub mono2">{{x.v}}</span></span><span class="chip" style="{{x.cs}}; color: #fff; min-width: 84px">{{x.sl}}</span></div></sc-for>
        </section>
        <section class="card" data-card="failed">
          <div class="ch"><span class="tile"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4 M12 17h.01 M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path></svg></span><h2 class="st">Failed in the last 24 hours</h2><span class="cnt">14</span><button type="button" class="btn" data-dev-confirm="Retry failed" data-what="Retry 14 failed messages (WhatsApp deadline_1d blocked by approval will fail again)" data-before="14 failed" data-after="Queued again" data-toast="Retry queued for 14 messages">Retry failed</button></div>
          <sc-for list="{{fails}}" as="x" hint-placeholder-count="3"><div class="it"><i class="dot warn"></i><span style="flex: 1"><b style="font-weight: 600; display: block">{{x.t}}</b><span class="sub">{{x.d}}</span></span><b style="font-weight: 600">{{x.n}}</b></div></sc-for>
        </section>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const D = window.DEV, A = window.ADM, s = this.state || {}, set = (o) => this.setState(o), dd = s.dd || '';
    if (!this.__l) { this.__l = 1; window.addEventListener('vcfo:devaudit', () => this.setState({ t: Date.now() })); }
    const toast = (m) => { if (window.vcfoToast) window.vcfoToast(m); };
    const ST = { ok: ['Working', '#0f6e51'], warn: ['Needs attention', '#be4400'], down: ['Down', '#b5302a'], connected: ['Connected', '#0f6e51'], attention: ['Needs attention', '#be4400'], off: ['Not connected', '#656f7e'], missing: ['Missing', '#b5302a'], fail: ['Failed', '#b5302a'], skip: ['Skipped', '#be4400'], pending: ['Waiting for approval', '#be4400'], approved: ['Approved', '#0f6e51'], pass: ['Passing', '#0f6e51'] };
    const chip = (k) => 'background:' + (ST[k] || ST.ok)[1];
    const base = { mode: s.mode || 'mixed', setMode: (m) => set({ mode: m }) };

    const fC = s.fC || '';
    const rows = D.ROUTES.filter(r => !fC || r[2] === fC).map(r => ({ type: r[0], when: r[1], ch: r[2], from: r[3], tpl: r[4], tsl: ST[r[5]][0], tcs: chip(r[5]), to: r[6], sent: r[7], del: r[7] ? r[8] + '%' : '-', dSt: r[7] && r[8] < 98 ? 'color:#be4400;font-weight:600' : '',
      testWhat: 'Send a test ' + r[0].toLowerCase() + ' from ' + r[3] + ' to Farhath', testToast: 'Test ' + r[0].toLowerCase() + ' sent from ' + r[3],
      editWhat: 'Change where the ' + r[0].toLowerCase() + ' is sent from', editAfter: r[2] === 'Email' ? 'notifications@sbcllp.in' : (r[2] === 'WhatsApp' ? '+91 80 4718 2291' : r[3]) }));
    const dom = D.DOMAIN.map(d => ({ k: d[0], v: d[2], sl: d[1] === 'pass' ? 'Passing' : 'Improve', cs: chip(d[1] === 'pass' ? 'pass' : 'warn') }));
    const fails = [['WhatsApp · deadline_1d', 'Template waiting for Meta approval', 14], ['Email · soft bounce', 'accounts@halcyonfin.example mailbox full (retrying)', 1], ['SMS · DND number', 'Promotional block on one number; sign-in codes still go', 0]]
      .map(([t, d, n]) => ({ t, d, n }));
    return Object.assign(base, { rows, nRows: rows.length, dom, fails, ddAny: !!dd, ddClose: () => set({ dd: '' }) },
      A.dd('dC', dd, 'c', 'fC', fC, [['Email', 'Email'], ['WhatsApp', 'WhatsApp'], ['SMS', 'SMS'], ['Teams', 'Teams']], 'All channels', set));
  }
}
</script>
<script src="../../routes.js"></script><script src="../../proto.js"></script>
</body>
</html>
