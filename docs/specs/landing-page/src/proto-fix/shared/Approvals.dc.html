<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approvals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
.ap{background:#fff;border:1px solid #e1e7ef;border-radius:8px;font-family:Public Sans,system-ui,sans-serif;color:#0f2a4a;font-size:13px}
.ap-h{display:flex;align-items:center;gap:8px;padding:12px 16px 10px}
.ap-h h2{margin:0;font-size:14px;font-weight:600}
.ap-n{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;background:#e8f0fa;color:#1b4f94;font-size:11px;font-weight:600}
.ap-r{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid #e1e7ef;min-height:36px}
.ap-ct{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}
.ap-t{flex:1;min-width:0}
.ap-t b{display:block;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-t em{font-style:normal;font-size:11.5px;color:#4b5b70}
.ap-b{height:28px;padding:0 10px;border-radius:6px;border:1px solid #c9d3df;background:#fff;color:#0f2a4a;font:600 12px Public Sans,sans-serif;cursor:pointer;flex:none}
.ap-b.pri{background:#1b4f94;border-color:#1b4f94;color:#fff}
.ap-b:focus-visible{outline:2px solid #1b4f94;outline-offset:1px}
.ap-e{padding:12px 16px 14px;border-top:1px solid #e1e7ef;font-size:12.5px;color:#4b5b70}
</style>
</helmet>
<section class="ap" data-card="approvals" aria-label="Approvals">
  <div class="ap-h"><h2>Waiting for your approval</h2><span class="ap-n">{{n}}</span></div>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
    <div class="ap-r"><span class="ap-ct" style="{{r.ct}}">{{r.k}}</span><span class="ap-t"><b>{{r.t}}</b><em>{{r.sub}}</em></span><button type="button" class="ap-b pri" onClick="{{r.ok}}">{{r.btn}}</button></div>
  </sc-for>
  <sc-if value="{{none}}" hint-placeholder-val="{{false}}"><div class="ap-e">Nothing is waiting for you.</div></sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mgr":{"editor":"text","default":"pranay"},"$preview":{"width":480,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    const A = window.ADM, s = this.state || {}, gone = s.gone || {}, mgr = this.props.mgr ?? 'pranay';
    const toast = (t) => { if (window.vcfoToast) window.vcfoToast(t); };
    const list = A.MTASKS.map((t, i) => ({ t, i })).filter(({ t }) => t[2] === mgr && t[3] !== 'done' && (t[5] === 'Approval' || t[5] === 'Review'));
    const lead = {}; A.allClients().forEach(c => { lead[c.k] = c.lead; });
    const rows = list.filter(({ t }) => !gone[t[0]]).sort((a, b) => a.t[4] - b.t[4]).map(({ t }) => { const c = A.C[t[1]];
      const hide = () => this.setState({ gone: Object.assign({}, gone, { [t[0]]: 1 }) });
      return { k: t[1], ct: 'background:' + c[2] + ';color:' + c[3], t: t[0], sub: c[0].split(' ')[0] + ' · ' + A.due(t[4]) + ' · ' + String(lead[t[1]] || '').split(' ')[0],
        btn: t[5] === 'Approval' ? 'Approve' : 'Review',
        ok: () => { hide(); toast((t[5] === 'Approval' ? 'Approved: ' : 'Opened for review: ') + t[0].replace(/^(Approve|Review) /, '') + ' · ' + c[0]); },
        later: () => { hide(); toast('Moved to tomorrow: ' + t[0] + ' · ' + c[0]); } }; });
    return { rows, n: rows.length, none: rows.length === 0 };
  }
}
</script>
</body>
</html>
