<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Next action (client)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc><template>
<helmet>
<style>
.ctd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #e1e7ef;border-radius:10px;padding:10px 14px;font-family:Public Sans,system-ui,sans-serif;color:#0f2a4a;font-size:13px}
.ctd-l{font-size:12px;font-weight:600;color:#4b5b70;flex:none}
.ctd-i{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.ctd-i b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctd-d{flex:none;font-size:12px;font-weight:600}
.ctd-dot{width:8px;height:8px;border-radius:50%;flex:none}
.ctd-m{font-size:12px;color:#4b5b70;flex:none}
.ctd-b{flex:none;height:30px;padding:0 12px;border-radius:6px;border:0;background:#1b4f94;color:#fff;font:600 12.5px Public Sans,sans-serif;cursor:pointer}
.ctd-b:focus-visible{outline:2px solid #1b4f94;outline-offset:2px}
</style>
</helmet>
<section class="ctd" data-card="next-action" aria-label="Your next action">
  <span class="ctd-l">Your next action</span>
  <span class="ctd-i"><span class="ctd-dot" style="{{dot}}"></span><b>{{t}}</b><span class="ctd-d" style="{{ds}}">{{d}}</span></span>
  <span class="ctd-m">{{more}}</span>
  <button type="button" class="ctd-b" onClick="{{go}}">{{btn}}</button>
</section>
</template></x-dc><script>(function(){var x=document.querySelector("x-dc"),t=x&&x.firstElementChild;if(t&&t.tagName==="TEMPLATE"){x.replaceChildren(document.adoptNode(t.content));}})();</script>
<script type="text/x-dc" data-dc-script data-props='{"after":{"editor":"text","default":"0"},"$preview":{"width":900,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    const after = String(this.props.after ?? '0') === '1';
    const toast = (t) => { if (window.vcfoToast) window.vcfoToast(t); };
    if (!after) return { t: 'Correct the passport copy, page 2', d: 'Overdue 3 days', ds: 'color:#b5302a', dot: 'background:#b5302a', more: '3 more for Northwind', btn: 'Correct now',
      go: () => toast('Opens the Proposed Directors step with the passport copy') };
    return { t: 'Fill the TDS challan details for October', d: 'Overdue 1 day', ds: 'color:#b5302a', dot: 'background:#b5302a', more: '3 more for Northwind', btn: 'Fill now',
      go: () => toast('Opens the TDS payment for October') };
  }
}
</script>
</body>
</html>
