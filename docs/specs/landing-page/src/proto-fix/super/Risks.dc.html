<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Super admin · Risks</title>
<script src="./support.js"></script>
<script src="./data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
/*@admin-css*/
/*@super-css*/
</style>
</helmet>
<div class="L" style="display: flex; flex-wrap: wrap; min-height: 100vh; position: relative">
  <div style="flex: 1 1 248px; max-width: 248px; background: #0f2a4a"><dc-import name="Side" active="risks" mode="{{mode}}" hint-size="248px,1000px"></dc-import></div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="Top" crumb="Overview › Risks" mode="{{mode}}" on-mode="{{setMode}}" hint-size="100%,56px"></dc-import>
    <main style="max-width: 1400px; width: 100%; margin: 0 auto; padding: 18px clamp(12px, 2vw, 28px) 110px; display: flex; flex-direction: column; gap: 16px">

      <div class="ds-bar">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="6"><button type="button" class="chipf" aria-pressed="{{k.on}}" onClick="{{k.pick}}">{{k.label}} <b>{{k.n}}</b></button></sc-for>
      </div>
      <section class="card" data-card="risk-list">
        <div class="rk h"><span>Kind</span><span>Risk</span><span>Owner</span><span style="text-align: right">Age</span><span></span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
          <div class="rk"><span><span class="chip" style="background: #eef2f7; color: #0f2a4a">{{r.kind}}</span></span>
            <span class="nm"><span class="ct" style="{{r.ct}}">{{r.k}}</span><span style="min-width: 0"><b style="font-weight: 600; display: block">{{r.t}}</b><span class="sub"><span class="sev" title="{{r.sevTip}}"><sc-for list="{{r.sev}}" as="v" hint-placeholder-count="3"><i class="{{v.c}}"></i></sc-for></span> {{r.name}}</span></span></span>
            <span><span style="display: block">{{r.mgr}}</span><span class="sub">{{r.adm}}</span></span>
            <span style="text-align: right">{{r.age}}</span>
            <button type="button" class="btn" style="min-width: 84px; height: 30px" onClick="{{r.nudge}}">{{r.act}}</button></div>
        </sc-for>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const A = window.ADM, s = this.state || {}, set = (o) => this.setState(o);
    if (!this.__l) { this.__l = 1; window.addEventListener('vcfo:assign', () => this.setState({ t: Date.now() })); }
    const all = A.allClients(), byK = {}; all.forEach(c => { byK[c.k] = c; });
    const M = (id) => A.ALLMGR[id] || { name: '', ini: '' };
    const AD = (id) => A.ADMINS[id] || { name: '', ini: '' };
    const ct = (k) => byK[k] ? 'background:' + byK[k].soft + ';color:' + byK[k].ink : 'background:#eef2f7;color:#4b5b70';
    const toast = (m) => { if (window.vcfoToast) window.vcfoToast(m); };
    const dd = s.dd || '';

    const fK = s.fK || '';
    const KS = Object.keys(A.RK);
    const kinds = [['', 'All', A.RISKS.length]].concat(KS.map(k => [k, A.RK[k], A.RISKS.filter(r => r[0] === k).length]))
      .map(([k, label, n]) => ({ label, n, on: fK === k ? 'true' : 'false', pick: () => set({ fK: k }) }));
    const rows = A.RISKS.filter(r => !fK || r[0] === fK).slice().sort((a, b) => b[5] - a[5] || b[4] - a[4]).map(r => { const c = byK[r[2]];
      const mgr = c ? M(c.mgr).name : 'No manager', adm = c ? AD(c.admin).name : 'Krishna (to assign)';
      return { kind: A.RK[r[0]], k: r[2] || '?', ct: ct(r[2]), t: r[1], name: c ? c.name : 'New client', mgr, adm,
        sev: [1, 2, 3].map(i => ({ c: i <= r[5] ? 'on' : '' })), sevTip: ['Low', 'Medium', 'High'][r[5] - 1] + ' severity',
        age: r[3] ? r[3] + (r[3] === 1 ? ' day' : ' days') : 'Today', imp: r[4] ? A.rupees(r[4]) : '-', impSt: r[4] ? 'color:#b5302a;font-weight:600' : '',
        act: r[0] === 'owner' ? 'Assign' : 'Nudge', nudge: () => toast((r[0] === 'owner' ? 'Asked ' : 'Nudged ') + (r[0] === 'owner' ? 'Krishna to assign a manager' : mgr + ' and ' + adm) + ' · ' + r[1]) }; });
    return { mode: s.mode || 'mixed', setMode: (m) => set({ mode: m }), kinds, rows };
  }
}
</script>
<script src="../../routes.js"></script><script src="../../proto.js"></script>
</body>
</html>
