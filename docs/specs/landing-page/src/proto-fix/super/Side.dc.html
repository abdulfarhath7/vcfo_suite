<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Super admin sidebar</title>
<script src="./support.js"></script>
<script src="./data.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}.lp-out:hover{background:rgba(255,255,255,.12)!important;color:#fff!important}.lp-out:focus-visible{outline:2px solid #fff;outline-offset:2px}</style>
</helmet>
<aside style="width: 100%; min-height: 1000px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: #0f2a4a; color: #fff; font-family: Public Sans, system-ui, sans-serif; font-size: 13px">
  <a href="#" aria-label="VCFO Suite home" style="height: 56px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.08); flex: none"><img src="vcfo-bin:brand/vcfo-logo-on-black.png" alt="VCFO Suite" style="height: 26px; width: auto"></a>
  <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 2px; padding: 12px 8px">
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="9">
      <div style="display: flex; flex-direction: column">
        <div style="position: relative">
        <a href="#" aria-current="{{n.cur}}" style="{{n.st}}">
          <span style="display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg></span>
          <span style="flex: 1">{{n.label}}</span>
          <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span style="min-width: 20px; height: 18px; padding: 0 5px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.12); color: #fff">{{n.badge}}</span></sc-if>
        </a>
        <sc-if value="{{n.canFold}}" hint-placeholder-val="{{false}}"><button type="button" class="ds-fold" data-nav-fold="{{n.foldKey}}" aria-expanded="{{n.openStr}}" aria-label="{{n.foldLabel}}" title="{{n.foldLabel}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></sc-if>
        </div>
        <sc-if value="{{n.hasSubs}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; padding: 0 0 4px 37px">
            <sc-for list="{{n.subs}}" as="sb" hint-placeholder-count="2"><a href="#" style="{{sb.st}}">{{sb.label}}</a></sc-for>
          </div>
        </sc-if>
        <sc-if value="{{n.showMgrs}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 1px; padding: 2px 0 6px 18px">
            <sc-for list="{{mgrs}}" as="m" hint-placeholder-count="3">
              <a href="#" data-pick-mgr="{{m.id}}" title="{{m.tip}}" aria-label="{{m.name}}" aria-current="{{m.cur}}" style="{{m.st}}">
                <span style="width: 20px; height: 20px; border-radius: 6px; flex: none; display: grid; place-items: center; font-size: 9px; font-weight: 600; color: #fff; background: rgba(255,255,255,.12)">{{m.ini}}</span><span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.name}}</span><span style="font: 600 10px Public Sans, sans-serif; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.1); color: #c9d6e8">{{m.n}}</span>
              </a>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{n.showClients}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; gap: 1px; padding: 2px 0 6px 18px">
            <sc-for list="{{clients}}" as="c" hint-placeholder-count="4">
              <a href="#" title="{{c.tip}}" aria-label="{{c.name}}" aria-current="{{c.cur}}" style="{{c.st}}">
                <span style="{{c.dot}}"></span><span style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span><span style="font: 600 10px Public Sans, sans-serif; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.1); color: #c9d6e8">{{c.phase}}</span>
              </a>
            </sc-for>
            <a href="#" style="height: 26px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 600; color: #e9eff6">View all 17</a>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </nav>
  <div style="margin-top: auto; padding: 0 14px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0 0; border-top: 1px solid rgba(255,255,255,.1); color: #fff">
      <span style="width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none">MI</span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 13px; font-weight: 600">Mithilesh</span><span style="display: block; font-size: 11px; color: #9fb0c6">Super admin</span></span>
      <button type="button" class="lp-out" data-signout aria-label="Sign out" title="Sign out" style="flex: none; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: none; color: #a9b6c9; cursor: pointer; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4.5H6A1.5 1.5 0 0 0 4.5 6v12A1.5 1.5 0 0 0 6 19.5h4"></path><path d="M14 8l4 4-4 4"></path><path d="M18 12H8.5"></path></svg></button>
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","clients","practice","team","money","risks","growth","reports","settings"],"default":"today"},"mode":{"editor":"enum","options":["before","mixed","after"],"default":"mixed"},"sub":{"editor":"text","default":""},"client":{"editor":"text","default":""},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const A = window.ADM;
    const active = this.props.active ?? 'today';
    if (!this.__l) { this.__l = 1; ['vcfo:nav', 'vcfo:mgr', 'vcfo:assign'].forEach(ev => window.addEventListener(ev, () => this.setState({ t: Date.now() }))); }
    const P = {
      today: 'M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z',
      practice: 'M4 19V9 M10 19V5 M16 19v-7 M22 19H2',
      team: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8 M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75',
      money: 'M3 6h18v12H3z M12 9.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5 M6 12h.01 M18 12h.01',
      risks: 'M12 9v4 M12 17h.01 M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z',
      growth: 'M3 17l6-6 4 4 8-8 M14 7h7v7',
      reports: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M8 13h8 M8 17h5',
      work: 'm3 17 2 2 4-4 M3 7l2 2 4-4 M13 6h8 M13 12h8 M13 18h8',
      managers: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8 M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75',
      clients: 'M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2 M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2 M10 6h4 M10 10h4 M10 14h4 M10 18h4',
      email: 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z m18 3-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7',
      docs: 'M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z',
      updates: 'm3 11 18-5v12L3 14v-3z M11.6 16.8a3 3 0 1 1-5.8-1.6',
      compliances: 'M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M16 2v4 M8 2v4 M3 10h18 M9 16l2 2 4-4',
      analytics: 'M3 3v18h18 M18 17V9 M13 17V5 M8 17v-3',
      audit: 'M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8 M3 3v5h5 M12 7v5l4 2',
      settings: 'M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'
    };
    const items = [['today', 'Overview'], ['clients', 'Clients', '17'], ['practice', 'Practice areas'], ['team', 'Team'], ['risks', 'Risks', String(A.RISKS.length)],
      ['growth', 'Growth'], ['reports', 'Reports'], ['settings', 'Settings']];
    const SUB = { practice: ['Incorporation', 'Registrations', 'Compliances'] };
    let fold = { managers: true, clients: true };
    try { fold = { managers: sessionStorage.getItem('vcfo.nav.managers') !== '0', clients: sessionStorage.getItem('vcfo.nav.clients') !== '0' }; } catch (e) {}
    let mgrSel = '';
    const curCl = this.props.client ?? '';
    const sub = (this.props.sub ?? '') || (active === 'managers' ? mgrSel : '') || (active === 'clients' ? curCl : '');
    const SEL = 'color:#fff;font-weight:600;background:#1d3d64;box-shadow:inset 3px 0 0 #c9a24b';
    const child = (on) => 'display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:6px;font-size:12.5px;' + (on ? SEL : 'color:#c9d6e8');
    const nav = items.map(([k, label, badge]) => {
      const on = k === active, canFold = k === 'managers' || k === 'clients';
      const subs = (SUB[k] || []).map(l => ({ label: l, st: 'display:flex;align-items:center;height:26px;padding:0 8px;border-radius:6px;font-size:12.5px;' + (on && l === sub ? SEL : 'color:#9fb0c6') }));
      return { label, d: P[k], cur: on ? 'page' : 'false', hasBadge: !!badge, badge: badge || '', subs, hasSubs: subs.length > 0,
        canFold, foldKey: k, openStr: fold[k] ? 'true' : 'false', foldLabel: (fold[k] ? 'Hide ' : 'Show ') + k,
        showMgrs: k === 'managers' && fold.managers, showClients: k === 'clients' && fold.clients,
        st: 'position:relative;display:flex;align-items:center;gap:11px;height:36px;padding:0 ' + (canFold ? '36px' : '10px') + ' 0 10px;border-radius:8px;font-size:13.5px;' + (on && !sub ? SEL : (on ? 'color:#fff;font-weight:600' : 'color:#b8c4d4;font-weight:500')) };
    });
    const mgrs = Object.keys(A.MGR).map(id => { const m = A.MGR[id], s = A.mgrStats(id);
      return { id, name: m.name, ini: m.ini, n: s.clients.length + ' clients', tip: m.name + ' · ' + s.clients.length + ' clients · ' + s.open + ' open', cur: mgrSel === id ? 'page' : 'false', st: child(mgrSel === id) }; });
    let list = A.allClients().filter(c => ['NT', 'OL', 'BR', 'KH'].indexOf(c.k) > -1);
    if (curCl && !list.some(c => c.name === curCl)) { const extra = A.allClients().find(c => c.name === curCl); if (extra) list = list.concat(extra); }
    const clients = list.map(c => ({ name: c.name, tip: c.name + ' · ' + (A.ALLMGR[c.mgr] ? A.ALLMGR[c.mgr].name : ''), phase: c.stage === 'inc' ? 'Inc' : 'Cmp', cur: c.name === curCl ? 'page' : 'false',
      st: child(c.name === curCl), dot: 'width:8px;height:8px;border-radius:2px;flex:none;background:' + c.dot }));
    return { nav, mgrs, clients };
  }
}
</script>
</body>
</html>
