<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VCFO Receivables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Receivables prototype (single file, no build step, no canvas).
  Two routes, switched with the demo bar or the URL hash:
    #/receivables          client page, no login, read-only, published version only
    #/receivables/manager  manager login, Outlook, sheet editor, HSBC feed, reminders, email, share
  All data is demo data shaped like "Receivables Summary Week 1 November.xlsx".
  The demo date is fixed at 3 Nov 2026 so overdue days match the sheet.
-->
<style>
:root {
  color-scheme: light;
  --surface: oklch(95.7% 0.008 254);
  --raised: #fff;
  --sunken: oklch(96.6% 0.006 255);
  --hover: oklch(97.3% 0.006 265);
  --line: oklch(88.9% 0.016 257);
  --line-soft: oklch(95.6% 0.007 248);
  --line-strong: oklch(81.5% 0.022 256);
  --ink: oklch(26% 0.06 251);
  --ink-2: oklch(42.3% 0.05 256);
  --ink-muted: oklch(53.4% 0.041 257);
  --ink-faint: oklch(66.8% 0.031 255);
  --brand: oklch(57.8% 0.235 278);
  --brand-strong: oklch(52.7% 0.239 277);
  --brand-soft: oklch(95.5% 0.023 289);
  --brand-text: oklch(49.3% 0.232 277);
  --brand-line: oklch(87.7% 0.063 287);
  --navy: oklch(26% 0.06 251);
  --positive: oklch(51% 0.125 154);
  --positive-soft: oklch(95% 0.03 158);
  --warning: oklch(50.6% 0.126 55);
  --warning-soft: oklch(96.1% 0.034 79);
  --danger: oklch(51.9% 0.197 22);
  --danger-soft: oklch(94.6% 0.028 9);
  --info: oklch(50% 0.172 257);
  --info-soft: oklch(95.5% 0.019 256);
  --upcoming: oklch(47.4% 0.04 258);
  --upcoming-soft: oklch(95.4% 0.007 261);
  --scrim: rgba(10, 37, 64, 0.42);
  --shadow-float: 0 16px 40px -12px rgba(10, 37, 64, 0.28), 0 4px 10px -4px rgba(10, 37, 64, 0.1);
  --shadow-dialog: 0 32px 64px -16px rgba(10, 37, 64, 0.4), 0 12px 24px -12px rgba(10, 37, 64, 0.18);
  --shadow-control: 0 1px 2px rgba(10, 37, 64, 0.05);
  --sans: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--surface);
  color: var(--ink);
  font: 13px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand-text); }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-family: var(--mono); font-size: 12px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-muted); }
.faint { color: var(--ink-faint); }
.hidden { display: none !important; }

/* Demo bar: not part of the product */
.demobar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 16px; background: var(--navy); color: oklch(85.7% 0.024 256);
  font-size: 12px;
}
.demobar .tag { color: oklch(71% 0.047 257); }
.demobar .addr {
  flex: 1 1 260px; min-width: 0; padding: 4px 10px; border-radius: 6px;
  background: oklch(31% 0.055 250); font-family: var(--mono); font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.demobar .addr b { color: #fff; font-weight: 500; }
.seg { display: inline-flex; border: 1px solid oklch(36% 0.07 254); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 12px; cursor: pointer; color: inherit; }
.seg button.on { background: oklch(36.2% 0.101 268); color: #fff; }

/* Layout */
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 14px 0;
}
.brand { font-weight: 700; letter-spacing: 0.06em; font-size: 13px; }
.brand span { font-weight: 500; letter-spacing: 0; color: var(--ink-muted); }
.top-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who { color: var(--ink-2); font-weight: 500; }
.tabs {
  display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
  overflow-x: auto; scrollbar-width: none;
}
.tabs button {
  border: 0; background: none; padding: 10px 14px; cursor: pointer; white-space: nowrap;
  color: var(--ink-muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
.tabs .count {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px;
  background: var(--upcoming-soft); color: var(--ink-2); font-size: 11px; text-align: center;
}
.card {
  background: var(--raised); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; margin-bottom: 16px;
}
.card h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
.card .sub { margin: 0 0 12px; color: var(--ink-muted); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raised);
  cursor: pointer; font-weight: 500; white-space: nowrap; box-shadow: var(--shadow-control);
  text-decoration: none; color: var(--ink);
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-strong); }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 6px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.danger-text { color: var(--danger); }

/* Chips: status always carries a word */
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 500; white-space: nowrap; line-height: 18px;
}
.chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.positive { background: var(--positive-soft); color: var(--positive); }
.chip.warning { background: var(--warning-soft); color: var(--warning); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.neutral { background: var(--upcoming-soft); color: var(--upcoming); }
.chip.brand { background: var(--brand-soft); color: var(--brand-text); }

/* Forms */
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12px; font-weight: 500; color: var(--ink-2); }
.input, .select, textarea.input {
  height: 34px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--raised); width: 100%; outline: none;
}
textarea.input { height: auto; padding: 8px 10px; resize: vertical; }
.input:focus, .select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.select.sm { height: 30px; width: auto; font-size: 12px; padding: 0 8px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.filters label { font-size: 12px; color: var(--ink-muted); display: inline-flex; align-items: center; gap: 6px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }

/* Publish bar */
.pubbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; margin-bottom: 16px; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--raised);
}
.pubbar.dirty { border-color: oklch(85% 0.07 70); background: var(--warning-soft); }
.pubbar .state { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: middle; }
th { font-size: 11px; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em; background: var(--sunken); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.block-title td {
  background: var(--raised); font-weight: 600; font-size: 12px; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--ink); padding-top: 12px; border-bottom: 1px solid var(--line);
}
.total td { font-weight: 600; background: var(--sunken); border-top: 1px solid var(--line); }
.grand { display: flex; justify-content: flex-end; gap: 24px; align-items: baseline; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); }
.grand .big { font-family: var(--mono); font-size: 20px; font-weight: 500; }
td.actions { white-space: nowrap; text-align: right; }
.cell {
  width: 100%; min-width: 70px; height: 28px; padding: 0 6px; border: 1px solid transparent;
  border-radius: 6px; background: transparent; outline: none;
}
.cell:hover { border-color: var(--line); }
.cell:focus { border-color: var(--brand); background: var(--raised); box-shadow: 0 0 0 3px var(--brand-soft); }
.cell.amt { text-align: right; font-family: var(--mono); font-size: 12px; min-width: 110px; }
.cell.inv { font-family: var(--mono); font-size: 12px; min-width: 84px; }
select.cell { min-width: 150px; cursor: pointer; }
.cell.client { min-width: 130px; }
table.sheet { min-width: 1040px; }
input[type=date].cell { min-width: 128px; }
.recv-row td { background: oklch(98% 0.012 158); }
.empty { padding: 28px; text-align: center; color: var(--ink-muted); }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.tile .k { font-size: 12px; color: var(--ink-muted); }
.tile .v { font-family: var(--mono); font-size: 20px; font-weight: 500; margin-top: 2px; }
.tile .s { font-size: 12px; color: var(--ink-muted); }

/* Lists */
.list { display: grid; gap: 0; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.li:last-child { border-bottom: 0; }
.confirm-card { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; background: var(--raised); }

/* Auth screens */
.auth { min-height: calc(100vh - 44px); display: grid; place-items: center; padding: 24px 16px; }
.auth .box { width: 100%; max-width: 380px; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: var(--shadow-float); }
.auth h1 { margin: 0 0 2px; font-size: 20px; }
.auth p { margin: 0 0 18px; color: var(--ink-muted); }

/* Modal */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal {
  width: 100%; max-width: 560px; max-height: calc(100vh - 32px); overflow: auto;
  background: var(--raised); border-radius: 14px; box-shadow: var(--shadow-dialog);
}
.modal.wide { max-width: 860px; }
.modal-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-h h2 { margin: 0; font-size: 15px; }
.modal-b { padding: 16px 20px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin-bottom: 14px; }
.kv dt { color: var(--ink-muted); }
.kv dd { margin: 0; }

/* Compose */
.rcpt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
.rcpt .lbl { width: 34px; flex: none; padding-top: 4px; color: var(--ink-muted); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
.rchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 9px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line); font-size: 12px; max-width: 100%; }
.rchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rchip button { border: 0; background: none; cursor: pointer; color: var(--ink-muted); width: 18px; height: 18px; border-radius: 50%; line-height: 1; }
.rchip button:hover { background: var(--line); color: var(--ink); }
.chipin { flex: 1; min-width: 160px; border: 0; outline: none; height: 26px; background: transparent; }
.body-edit {
  margin-top: 12px; min-height: 260px; max-height: 46vh; overflow: auto; padding: 12px 14px;
  border: 1px solid var(--line-strong); border-radius: 8px; outline: none; background: var(--raised);
  font: 13px/1.5 Calibri, 'Segoe UI', var(--sans);
}
.body-edit:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.notice { padding: 10px 12px; border-radius: 8px; background: var(--warning-soft); color: var(--warning); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.notice.info { background: var(--info-soft); color: var(--info); }

/* Share */
.share-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.share-grid .btn { height: 44px; justify-content: center; }
.linkbox { display: flex; gap: 8px; margin-bottom: 14px; }
.linkbox .input { font-family: var(--mono); font-size: 12px; }

/* Toast */
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: max-content; max-width: calc(100vw - 32px); }
.toast { background: var(--navy); color: #fff; padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow-float); font-size: 13px; animation: tin .18s ease-out; }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Client page */
.stamp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; color: var(--ink-2); }
.foot { margin-top: 8px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--ink-muted); font-size: 12px; }

@media (max-width: 640px) {
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .grand { flex-direction: column; align-items: flex-end; gap: 2px; }
  .auth .box { padding: 22px; }
}
@media print {
  .demobar, .tabs, .pubbar, .filters, .top-r, td.actions, th.actions, #toast, .noprint { display: none !important; }
  body { background: #fff; }
  .tablewrap { border: 0; }
}
</style>
</head>

<script>
/* ===================== Dates and formatting ===================== */
const TODAY = '2026-11-03';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function d(iso) { const [y, m, dd] = iso.split('-').map(Number); return new Date(y, m - 1, dd); }
function toIso(x) { return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
function addDays(iso, n) { const x = d(iso); x.setDate(x.getDate() + n); return toIso(x); }
/** a minus b, in whole days. */
function diffDays(a, b) { return Math.round((d(a) - d(b)) / 86400000); }
function fmtDate(iso) { if (!iso) return ''; const x = d(iso); return String(x.getDate()).padStart(2, '0') + '-' + MON[x.getMonth()] + '-' + String(x.getFullYear()).slice(2); }
function shortDate(iso) { const x = d(iso); return x.getDate() + ' ' + MON[x.getMonth()]; }
function isWeekend(iso) { const w = d(iso).getDay(); return w === 0 || w === 6; }
function monthLong(m) { const i = MON.indexOf(m.slice(0, 3)); return MON_LONG[i] + ' 20' + m.slice(4); }
function monthTitle(m) { return MON_LONG[MON.indexOf(m.slice(0, 3))] + '-' + m.slice(4) + ' Receivables'; }
function nowStamp() { const t = new Date(); return '3 Nov 2026, ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0'); }
const inrFmt = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
function inr(n) { return inrFmt.format(Math.round(n || 0)); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function clone(x) { return JSON.parse(JSON.stringify(x)); }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

/* ===================== Helpers over the data ===================== */
const byId = id => S.invoices.find(i => i.id === id);
const partner = id => S.partners.find(p => p.id === id) || { id, name: id, email: '' };
function allContacts() {
  const seen = new Set(); const out = [];
  [...S.partners, ...OTHER_CONTACTS].forEach(c => { const k = c.email.toLowerCase(); if (!seen.has(k)) { seen.add(k); out.push({ name: c.name, email: c.email }); } });
  return out;
}
function isOpen(i) { return !i.paid; }
function daysLeft(i) { return diffDays(i.due, TODAY); }
function isOverdue(i) { return isOpen(i) && daysLeft(i) < 0; }
function paidThisWeek(i) { return i.paid && i.paid.date >= addDays(TODAY, -6); }
function sum(list) { return list.reduce((a, i) => a + Number(i.amount || 0), 0); }
function touch(note) { S.dirty++; S.changes.push(note); }

function chip(tone, text) { return `<span class="chip ${tone}">${esc(text)}</span>`; }
function dueChip(i) {
  if (i.paid) return chip('positive', 'Received');
  const dl = daysLeft(i);
  if (dl < 0) return chip('danger', plural(-dl, 'day') + ' overdue');
  if (dl === 0) return chip('warning', 'Due today');
  return chip('neutral', 'Due in ' + plural(dl, 'day'));
}
function payTiming(i) {
  const late = diffDays(i.paid.date, i.due);
  if (late > 0) return plural(late, 'day') + ' late';
  if (late === 0) return 'On the due date';
  return plural(-late, 'day') + ' early';
}

/* Reminder rule: 5 days before, 3 days before, the due date, then every day after. */
function reminderOn(i, iso) {
  if (i.paid) return null;
  const p = S.rem.paused[i.id];
  if (p && iso <= p.until) return null;
  if (S.rem.rules.skipWeekends && isWeekend(iso)) return null;
  const dl = diffDays(i.due, iso);
  if (dl === 5) return { label: '5 days before due', tone: 'info' };
  if (dl === 3) return { label: '3 days before due', tone: 'info' };
  if (dl === 0) return { label: 'Due today', tone: 'warning' };
  if (dl < 0) return { label: plural(-dl, 'day') + ' overdue', tone: 'danger' };
  return null;
}
function nextReminder(i) {
  if (i.paid) return '';
  const start = (S.rem.sent || S.rem.skipped[i.id]) ? 1 : 0;
  for (let n = start; n < 90; n++) { const iso = addDays(TODAY, n); if (reminderOn(i, iso)) return n === 0 ? 'Today 09:00' : shortDate(iso); }
  return '';
}
function reminderQueue() { return S.invoices.map(i => ({ i, r: reminderOn(i, TODAY) })).filter(x => x.r); }
function reminderDraft(i, r) {
  const p = partner(i.partner);
  const first = p.name.split(' ')[0];
  const subject = `Reminder: ${i.client} invoice ${i.inv || ''} · ${r.label}`.replace('  ', ' ');
  let line;
  if (r.label === 'Due today') line = `${i.client}'s invoice ${i.inv} for ₹${inr(i.amount)} is due today (${fmtDate(i.due)}).`;
  else if (r.tone === 'danger') line = `${i.client}'s invoice ${i.inv} for ₹${inr(i.amount)} was due on ${fmtDate(i.due)} and is now ${r.label}. Please follow up with the client.`;
  else line = `${i.client}'s invoice ${i.inv} for ₹${inr(i.amount)} falls due on ${fmtDate(i.due)} (${r.label.replace(' before due', '')} from today).`;
  const body = `Hi ${first},\n\n${line}\n\nThe live receivables page: ${LIVE_URL}?partner=${p.id}\n\nRegards,\n${MANAGER.name}\nSBC`;
  return S.rem.edits[i.id] || { subject, body };
}

function readHash() {
  const h = location.hash.replace(/^#/, '');
  const [path, q] = h.split('?');
  S.route = path.startsWith('/receivables/manager') ? 'manager' : 'client';
  const params = new URLSearchParams(q || '');
  const p = params.get('partner');
  if (S.route === 'client') {
    if (p && S.partners.some(x => x.id === p)) S.clientPartner = p;
    else if (!p) { try { const saved = localStorage.getItem('rcv-partner'); if (saved && (saved === 'all' || S.partners.some(x => x.id === saved))) S.clientPartner = saved; } catch (e) {} }
  }
}
/* Route changes render directly; the hash is only kept in step, because some previews block hash navigation. */
function go(route) {
  S.route = route;
  const qs = route === 'client' && S.clientPartner !== 'all' ? '?partner=' + S.clientPartner : '';
  try { history.replaceState(null, '', route === 'manager' ? '#/receivables/manager' : '#/receivables' + qs); } catch (e) {}
  render(); window.scrollTo(0, 0);
}

/* ===================== Client page ===================== */
function renderClient() {
  const snap = S.published;
  const p = S.clientPartner;
  const mine = snap.filter(i => p === 'all' || i.partner === p);
  const open = mine.filter(isOpen);
  const overdue = open.filter(i => daysLeft(i) < 0);
  const recv = mine.filter(paidThisWeek);
  const months = [...new Set(snap.map(i => i.month))].sort((a, b) => S.months.indexOf(a) - S.months.indexOf(b));
  const opt = (v, l) => `<option value="${v}" ${p === v ? 'selected' : ''}>${esc(l)}</option>`;
  let tables = '';
  months.forEach(m => {
    const list = open.filter(i => i.month === m).sort((a, b) => a.due.localeCompare(b.due));
    if (!list.length) return;
    tables += `<tr class="block-title"><td colspan="${p === 'all' ? 6 : 5}">${esc(monthTitle(m))}</td></tr>` + list.map(i => `<tr>
      <td>${esc(i.client)}</td><td class="mono">${esc(i.inv)}</td>${p === 'all' ? `<td>${esc(partner(i.partner).name)}</td>` : ''}
      <td>${fmtDate(i.due)}</td><td class="num">${inr(i.amount)}</td><td>${dueChip(i)}</td></tr>`).join('')
      + `<tr class="total"><td colspan="${p === 'all' ? 4 : 3}">${esc(m.replace('-', "'"))} receivables</td><td class="num">${inr(sum(list))}</td><td></td></tr>`;
  });
  if (!tables) tables = `<tr><td colspan="6" class="empty">No open invoices for this partner.</td></tr>`;
  const recvRows = recv.map(i => `<tr class="recv-row"><td>${esc(i.client)}</td><td class="mono">${esc(i.inv)}</td>${p === 'all' ? `<td>${esc(partner(i.partner).name)}</td>` : ''}<td>${fmtDate(i.paid.date)}</td><td class="num">${inr(i.paid.amount)}</td><td>${esc(payTiming(i))}</td></tr>`).join('');
  return `<div class="wrap">
    <header class="top"><div class="brand">VCFO SUITE <span>/ Receivables · ${esc(CLIENT_ORG)}</span></div></header>
    <div class="stamp">${chip('positive', 'Live')}<span>Updated ${esc(S.publishedAt)} by SBC</span></div>
    <div class="filters"><label>Client partner <select class="select sm" data-client-partner>${opt('all', 'All partners')}${S.partners.map(x => opt(x.id, x.name)).join('')}</select></label></div>
    <div class="tiles">
      <div class="tile"><div class="k">Open receivables</div><div class="v">₹${inr(sum(open))}</div><div class="s">${plural(open.length, 'invoice')}</div></div>
      <div class="tile"><div class="k">Overdue</div><div class="v">₹${inr(sum(overdue))}</div><div class="s">${plural(overdue.length, 'invoice')}${overdue.length ? ', oldest ' + Math.max(...overdue.map(i => -daysLeft(i))) + ' days' : ''}</div></div>
      <div class="tile"><div class="k">Received this week</div><div class="v">₹${inr(recv.reduce((a, i) => a + i.paid.amount, 0))}</div><div class="s">${plural(recv.length, 'payment')}</div></div>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th>Client</th><th>Invoice no.</th>${p === 'all' ? '<th>Client partner</th>' : ''}<th>Due date</th><th style="text-align:right">Amount INR</th><th>Status</th></tr></thead>
      <tbody>${tables}</tbody></table></div>
    ${recv.length ? `<div class="tablewrap"><table><thead><tr class="block-title"><td colspan="6">Received this week</td></tr><tr><th>Client</th><th>Invoice no.</th>${p === 'all' ? '<th>Client partner</th>' : ''}<th>Paid on</th><th style="text-align:right">Amount INR</th><th>Paid</th></tr></thead><tbody>${recvRows}</tbody></table></div>` : ''}
    <div class="foot"><span>Read only. Figures change when SBC publishes an update.</span><button class="btn sm noprint" data-act="csv-client">Download Excel</button></div>
  </div>`;
}

function overdueList() {

function emailBodyHtml() {
  const snap = S.published;
  const recv = snap.filter(paidThisWeek);
  const cell = 'border:1px solid #333;padding:3px 8px;font-size:12px;';
  const head = `background:#000;color:#fff;font-weight:bold;text-align:center;${cell}`;
  const months = [...new Set(snap.map(i => i.month))].sort((a, b) => S.months.indexOf(a) - S.months.indexOf(b));
  let tables = '';
  months.forEach(m => {
    const list = snap.filter(i => i.month === m && (isOpen(i) || paidThisWeek(i))).sort((a, b) => a.due.localeCompare(b.due));
    if (!list.length) return;
    tables += `<table style="border-collapse:collapse;margin:10px 0;min-width:560px"><tr><td colspan="5" style="${head}">${esc(monthTitle(m).replace(' Receivables', ' -Receivables'))}</td></tr>
      <tr>${['Client', 'Due Date', 'Invoice Amount INR', 'No of Days Over Due', 'Remarks'].map(h => `<td style="${cell}font-weight:bold;text-align:center">${h}</td>`).join('')}</tr>
      ${list.map(i => { const dl = daysLeft(i); const bg = i.paid ? 'background:#d9ead3;' : ''; return `<tr><td style="${cell}${bg}">${esc(i.client)}</td><td style="${cell}${bg}text-align:center">${fmtDate(i.due)}</td><td style="${cell}${bg}text-align:right">${inr(i.amount)}</td><td style="${cell}${bg}text-align:center">${dl < 0 ? -dl : '-'}</td><td style="${cell}${bg}">${i.paid ? 'Received' : ''}</td></tr>`; }).join('')}
      <tr><td style="${cell}font-weight:bold;text-align:center">${esc(m.replace('-', "'"))}- Receivables</td><td style="${cell}"></td><td style="${cell}font-weight:bold;text-align:right">${inr(sum(list.filter(isOpen)))}</td><td style="${cell}"></td><td style="${cell}"></td></tr></table>`;
  });
  const total = sum(snap.filter(isOpen));
  const paidLines = recv.length
    ? `<p>We have received the following payments:</p><ul>${[...new Set(recv.map(i => `<li><b>${esc(i.client)}</b> - ${esc(monthLong(i.month))}</li>`))].join('')}</ul>`
    : `<p>No new payments have been received since the last update.</p>`;
  return `<p>Hi Team,</p>${paidLines}<p>Please find the receivable summary as of today:</p>${tables}
    <table style="border-collapse:collapse;margin:0 0 10px;min-width:560px"><tr><td style="${cell}font-weight:bold;text-align:center;width:40%">Total Receivables</td><td style="${cell}font-weight:bold;text-align:right">${inr(total)}</td></tr></table>
    <p>Live view, always current: <a href="${LIVE_URL}">app.sbctrack.in/receivables</a></p>
    <p>Regards,<br>${esc(MANAGER.name)}<br>SBC</p>`;
}

    ${['to', 'cc', 'bcc'].map(f => `<div class="rcpt"><span class="lbl">${f === 'to' ? 'To' : f === 'cc' ? 'Cc' : 'Bcc'}</span><div class="chips" id="chips-${f}"></div></div>`).join('')}

function renderChips(field) {
  const box = document.getElementById('chips-' + field); if (!box) return;
  box.innerHTML = S.compose[field].map((c, n) => `<span class="rchip" title="${esc(c.email)}"><span>${esc(c.name || c.email)}</span><button type="button" data-act="chip-x" data-field="${field}" data-n="${n}" aria-label="Remove ${esc(c.name || c.email)}">✕</button></span>`).join('')
    + `<input class="chipin" list="contacts" data-chipin="${field}" placeholder="${S.compose[field].length ? '' : 'Add a name or any email'}" aria-label="Add ${field} recipient">`;
}
function parseRecipient(v) {
  v = v.trim().replace(/[,;]$/, '').trim(); if (!v) return null;
  const m = v.match(/^(.*)<([^>]+)>$/);
  if (m) return { name: m[1].trim(), email: m[2].trim() };
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { const c = allContacts().find(x => x.email.toLowerCase() === v.toLowerCase()); return c || { name: '', email: v }; }
  const c = allContacts().find(x => x.name.toLowerCase().startsWith(v.toLowerCase()));
  return c || null;
}
function addChip(field, value) {
  const r = parseRecipient(value);
  if (!r) { if (value.trim()) toast('"' + value.trim() + '" is not an email address or a known contact.'); return false; }
  if (['to', 'cc', 'bcc'].some(f => S.compose[f].some(x => x.email.toLowerCase() === r.email.toLowerCase()))) toast((r.name || r.email) + ' is already a recipient.');
  else S.compose[field].push(r);
  renderChips(field);
  const inp = document.querySelector(`[data-chipin="${field}"]`); if (inp) inp.focus();
  return true;
}

/* ===================== Downloads ===================== */
function downloadCsv(rows, name) {
  const head = ['Month', 'Client', 'Invoice no.', 'Client partner', 'Due date', 'Amount INR', 'Days overdue', 'Status', 'Paid on'];
  const lines = [head].concat(rows.map(i => [monthLong(i.month), i.client, i.inv || '', partner(i.partner).name, fmtDate(i.due), Math.round(i.amount),
    i.paid ? '' : Math.max(0, -daysLeft(i)), i.paid ? 'Received' : (daysLeft(i) < 0 ? 'Overdue' : 'Open'), i.paid ? fmtDate(i.paid.date) : '']));
  const csv = lines.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('Downloaded ' + name + ' (opens in Excel).');
}

/* ===================== Toast ===================== */
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.getElementById('toast').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ===================== Actions ===================== */
function publish() {
  if (!S.dirty) return;
  S.publishedAt = nowStamp();
  S.published = clone(S.invoices);
  const note = [...new Set(S.changes)].slice(0, 3).join('; ') + (new Set(S.changes).size > 3 ? '; and more' : '');
  S.versions.unshift({ at: S.publishedAt, note, snap: clone(S.invoices) });
  S.dirty = 0; S.changes = [];
  toast('Published. The client page now shows ' + S.publishedAt + '.');
}
function markPaid(i, date, amount, via) {
  i.paid = { date, amount, via };
  delete S.rem.paused[i.id];
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act; const id = t.dataset.id;
  if (act === 'scrim') { if (e.target === t) closeModal(); return; }
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault();
  switch (act) {
    case 'go': closeModal(); go(t.dataset.to); return;
    case 'close': closeModal(); return;
    case 'toast': toast(t.dataset.msg); return;
    case 'outlook-connect': S.outlook = true; S.outlookAsked = true; closeModal(); toast('Outlook connected as ' + MANAGER.email + '.'); break;
    case 'outlook-connect-compose': S.outlook = true; S.outlookAsked = true; render(); toast('Outlook connected as ' + MANAGER.email + '.'); composeModal(); return;
    case 'outlook-later': S.outlookAsked = true; break;
    case 'outlook-disconnect': S.outlook = false; toast('Outlook disconnected. Email and reminders are paused.'); break;
    case 'logout': S.authed = false; S.outlookAsked = false; break;
    case 'tab': S.tab = t.dataset.tab; break;
    case 'update': publish(); closeModal(); break;
    case 'update-compose': publish(); render(); composeModal(); return;
    case 'compose': closeModal(); composeModal(); return;
    case 'share': shareModal(); return;
    case 'add-invoice': addInvoiceModal(); return;
    case 'add-partner': addPartnerModal(); return;
    case 'mark': markModal(id); return;
    case 'pause': pauseModal(id); return;
    case 'undo-paid': { const i = byId(id); i.paid = undefined; touch(i.client + ' ' + i.inv + ' set back to open'); toast(i.client + ' ' + i.inv + ' is open again (draft).'); break; }
    case 'fetch': {
      S.lastFetch = new Date().toTimeString().slice(0, 5);
      if (!S.fetched) {
        S.fetched = true;
        const i = byId('i13');
        if (i && isOpen(i)) {
          S.credits.unshift({ id: 'c4', date: TODAY, payer: 'BONTERRA INC', ccy: 'USD', fc: 19915, inr: i.amount, match: 'i13', status: 'auto' });
          markPaid(i, TODAY, i.amount, 'HSBC'); touch('Bonterra SC/09/24 received (HSBC)');
          toast('1 new credit: Bonterra ₹' + inr(i.amount) + ', auto-matched and marked Received.');
        } else toast('No new credits since the last fetch.');
      } else toast('No new credits since the last fetch.');
      break;
    }
    case 'credit-confirm': {
      const c = S.credits.find(x => x.id === id); const i = byId(c.match);
      if (!i || !isOpen(i)) { toast('Pick an open invoice first.'); return; }
      markPaid(i, c.date, c.inr, 'HSBC'); c.status = 'confirmed';
      touch(i.client + ' ' + i.inv + ' received (HSBC, confirmed)');
      toast(i.client + ' ' + i.inv + ' marked Received in the draft.');
      break;
    }
    case 'credit-ignore': { const c = S.credits.find(x => x.id === id); c.status = 'ignored'; toast('Marked as not a receipt.'); break; }
    case 'rem-skip': S.rem.skipped[id] = !S.rem.skipped[id]; break;
    case 'rem-edit': remEditModal(id); return;
    case 'rem-resume': delete S.rem.paused[id]; closeModal(); toast('Reminders resumed.'); break;
    case 'rem-run': {
      const q = reminderQueue().filter(x => !S.rem.skipped[x.i.id]);
      q.forEach(({ i, r }) => S.rem.history.unshift({ at: '3 Nov, 09:00', to: partner(i.partner).email, what: `${i.client} ${i.inv} · ${r.label}` }));
      S.rem.sent = true;
      toast(plural(q.length, 'reminder') + ' sent from ' + MANAGER.email + '.');
      break;
    }
    case 'version-view': versionModal(Number(t.dataset.n)); return;
    case 'copy': {
      const text = t.dataset.text;
      const done = () => toast('Link copied: ' + text);
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => toast('Copy this link: ' + text)); else toast('Copy this link: ' + text);
      return;
    }
    case 'reset-key': S.key = Math.random().toString(36).slice(2, 10); toast('New key issued. Old secret links stop working.'); break;
    case 'pdf': closeModal(); setTimeout(() => window.print(), 50); return;
    case 'csv-manager': downloadCsv(S.published, 'Receivables ' + S.publishedAt.slice(0, 10) + '.csv'); return;
    case 'csv-client': downloadCsv(S.published.filter(i => S.clientPartner === 'all' || i.partner === S.clientPartner), 'Receivables ' + S.publishedAt.slice(0, 10) + '.csv'); return;
    case 'chip-x': S.compose[t.dataset.field].splice(Number(t.dataset.n), 1); renderChips(t.dataset.field); return;
    case 'compose-send': {
      const c = S.compose;
      const pending = document.querySelectorAll('[data-chipin]');
      pending.forEach(inp => { if (inp.value.trim()) addChip(inp.dataset.chipin, inp.value); });
      if (!c.to.length) { toast('Add at least one recipient in To.'); return; }
      const subject = document.getElementById('cp-sub').value;
      S.sentLog.unshift({ at: nowStamp(), subject, to: c.to.length, cc: c.cc.length, bcc: c.bcc.length });
      const extra = [c.cc.length ? c.cc.length + ' in Cc' : '', c.bcc.length ? c.bcc.length + ' in Bcc' : ''].filter(Boolean).join(', ');
      closeModal();
      toast(`Sent "${subject}" from ${MANAGER.email} to ${plural(c.to.length, 'person')}${extra ? ' (' + extra + ')' : ''}.`);
      return;
    }
    default: return;
  }
  render();
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.edit) {
    const i = byId(el.dataset.id); const f = el.dataset.edit; let v = el.value;
    if (f === 'amount') { v = Number(String(v).replace(/[^0-9.]/g, '')) || 0; }
    if (f === 'due' && !v) { render(); return; }
    if (i[f] === v) return;
    i[f] = v;
    const label = { client: 'client name', inv: 'invoice number', partner: 'client partner', due: 'due date', amount: 'amount' }[f];
    touch(`${i.client} ${i.inv || ''} ${label} edited`.replace('  ', ' '));
    render();
    return;
  }
  if (el.dataset.filter) { S.f[el.dataset.filter] = el.value; render(); return; }
  if (el.hasAttribute('data-client-partner')) {
    S.clientPartner = el.value;
    try { localStorage.setItem('rcv-partner', el.value); } catch (err) {}
    try { history.replaceState(null, '', el.value === 'all' ? '#/receivables' : '#/receivables?partner=' + el.value); } catch (err) {}
    render(); return;
  }
  if (el.dataset.creditPick) { const c = S.credits.find(x => x.id === el.dataset.creditPick); c.match = el.value; render(); return; }
  if (el.dataset.rule) { S.rem.rules[el.dataset.rule] = el.checked; render(); return; }
  if (el.dataset.actChange === 'apply-list') {
    const l = el.value === 'weekly' ? weeklyList() : el.value === 'overdue' ? overdueList() : { to: [], cc: [] };
    S.compose.to = l.to.slice(); S.compose.cc = l.cc.slice(); S.compose.bcc = [];
    ['to', 'cc', 'bcc'].forEach(renderChips); return;
  }
  if (el.dataset.chipin && el.value.trim()) { if (addChip(el.dataset.chipin, el.value)) el.value = ''; }
});

document.addEventListener('keydown', e => {
  const el = e.target;
  if (el.dataset && el.dataset.chipin) {
    if (e.key === 'Enter' || e.key === ',' || e.key === ';' || (e.key === 'Tab' && el.value.trim())) {
      e.preventDefault(); addChip(el.dataset.chipin, el.value);
    } else if (e.key === 'Backspace' && !el.value) {
      const f = el.dataset.chipin; if (S.compose[f].length) { S.compose[f].pop(); renderChips(f); }
    }
    return;
  }
  if (e.key === 'Escape' && document.getElementById('modal-root').innerHTML) closeModal();
});

document.addEventListener('submit', e => {
  const f = e.target; const kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  const val = id => document.getElementById(id).value;
  if (kind === 'login') { S.authed = true; S.tab = 'sheet'; render(); return; }
  if (kind === 'mark') {
    const i = byId(f.dataset.id);
    const amt = Number(val('mk-amt').replace(/[^0-9.]/g, '')) || 0; const date = val('mk-date') || TODAY;
    const part = f.querySelector('input[name="mk-kind"]:checked').value === 'part';
    if (part && amt < i.amount) {
      i.amount = i.amount - amt; i.part = (i.part || 0) + amt;
      touch(`${i.client} ${i.inv} part payment ₹${inr(amt)}`);
      toast(`₹${inr(amt)} recorded. ₹${inr(i.amount)} stays open.`);
    } else {
      markPaid(i, date, amt, 'Manual');
      touch(`${i.client} ${i.inv} marked Received`);
      toast(`${i.client} ${i.inv} marked Received (draft). Click Update to publish.`);
    }
    closeModal(); render(); return;
  }
  if (kind === 'pause') {
    S.rem.paused[f.dataset.id] = { until: val('ps-until') || addDays(TODAY, 7), reason: val('ps-why') };
    closeModal(); toast('Reminders paused until ' + fmtDate(S.rem.paused[f.dataset.id].until) + '.'); render(); return;
  }
  if (kind === 'add-invoice') {
    const m = val('ai-month');
    const n = { id: 'i' + Date.now(), month: m, client: val('ai-client').trim(), inv: val('ai-inv').trim(), partner: val('ai-partner'), due: val('ai-due'), amount: Number(val('ai-amt').replace(/[^0-9.]/g, '')) || 0 };
    S.invoices.push(n);
    if (!S.months.includes(m)) { S.months.push(m); S.months.sort((a, b) => (a.slice(4) + String(MON.indexOf(a.slice(0, 3))).padStart(2, '0')).localeCompare(b.slice(4) + String(MON.indexOf(b.slice(0, 3))).padStart(2, '0'))); }
    touch(`${n.client} ${n.inv} added`);
    closeModal(); toast('Invoice added to the draft.'); render(); return;
  }
  if (kind === 'add-partner') {
    const name = val('ap-name').trim(); const email = val('ap-email').trim();
    let id = name.split(' ')[0].toLowerCase().replace(/[^a-z]/g, '') || 'partner';
    while (S.partners.some(p => p.id === id)) id += '2';
    S.partners.push({ id, name, email });
    closeModal(); toast(name + ' added.'); render(); return;
  }
  if (kind === 'rem-edit') {
    S.rem.edits[f.dataset.id] = { subject: val('re-sub'), body: val('re-body') };
    closeModal(); toast('Reminder text saved for today.'); return;
  }
});

/* ===================== Start ===================== */
readHash();
if (!location.hash) { try { history.replaceState(null, '', '#/receivables'); } catch (e) {} }
render();
</script>
